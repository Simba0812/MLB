<title>NBA 盲標對決</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Noto+Sans+TC:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout (shared with the baseball page, source/template.html): a hand-operated scoreboard — green panels, chalk numerals, two team colors. Single dark look by choice. */
:root{
  --board:#0d3326; --panel:#14463a; --panel2:#1b5546; --line:#2c6b5a;
  --chalk:#f1ede0; --dim:#a9c2b6; --amber:#f2b134; --sky:#7cc7ea; --red:#e0664f; --good:#7fd38a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--board);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 46px)}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
/* draft screen: everything, bid box included, should fit one screen. render() tags .wrap with the screen
   (s-draft, s-pick, s-game) instead of :has(), which phones re-check on every update */
.wrap.s-draft{gap:10px}
.wrap.s-draft header.top{padding-bottom:6px}
.wrap.s-draft h1{font-size:clamp(26px,3vw,34px)}
.wrap.s-draft h1 small{font-size:13px;margin-top:2px}
.draft .panel{padding:12px 14px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--chalk);padding-bottom:10px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,6vw,58px);line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 small{display:block;font-family:var(--body);font-size:15px;font-weight:500;color:var(--dim);letter-spacing:0;text-transform:none;margin-top:6px}
h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h3{margin:0;font-size:16px;font-weight:700}
.src{font-size:12px;color:var(--dim);text-align:right}
.hdr-r{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.src a{color:var(--dim)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
input,select{font:inherit;color:var(--chalk);background:var(--board);border:2px solid var(--line);border-radius:3px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--chalk);background:transparent;color:var(--chalk);padding:9px 16px;border-radius:3px}
button.solid{background:var(--chalk);color:var(--board)}
button.a{border-color:var(--amber);color:var(--amber)} button.a.solid{background:var(--amber);color:#1d1606}
button.b{border-color:var(--sky);color:var(--sky)} button.b.solid{background:var(--sky);color:#06202c}
button:disabled{opacity:.35;cursor:not-allowed}
button.ghost{border-color:var(--line);color:var(--dim);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ta{color:var(--amber)} .tb{color:var(--sky)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--dim);margin:0}

/* draft */
.draft{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.8fr) minmax(0,.8fr);gap:12px;align-items:start}
@media (max-width:960px){.draft{grid-template-columns:1fr}.draft .lotcol{order:-1}}
.teamcard{border-top:6px solid var(--amber)} .teamcard.B{border-top-color:var(--sky)}
.teamcard .money{font-family:var(--display);font-weight:900;font-size:clamp(30px,2.6vw,40px);line-height:1}
.slotpick{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--chalk)}
.slotpick select{padding:4px 8px}
.slots{display:grid;grid-template-columns:auto 1fr auto;gap:0 8px;font-size:12.5px;line-height:1.4;margin-top:8px}
.slots .k{font-family:var(--mono);color:var(--dim)} .slots .v{min-width:0;overflow-wrap:anywhere} .slots .p{font-family:var(--mono);color:var(--dim);text-align:right}
.slots .empty{color:#6f9686}
.need{font-size:12px;color:var(--dim);margin-top:8px}
.lot{position:relative;perspective:1200px}
.card{background:var(--chalk);color:#10261d;border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;transform-origin:50% 50%}
.card.flip{animation:flip .6s ease}
@keyframes flip{from{transform:rotateY(90deg);opacity:.2}to{transform:rotateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}}
.card .lotno{font-family:var(--mono);font-size:12px;color:#4d6a5d}
.card .name{font-family:var(--display);font-weight:900;font-size:clamp(26px,3vw,38px);line-height:.95;text-transform:uppercase}
.card .zh{font-size:17px;font-weight:900}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.pos{display:inline-block;background:#10261d;color:var(--chalk);font-family:var(--mono);font-weight:600;padding:2px 8px;border-radius:2px}
.ovr{margin-left:auto;font-family:var(--display);font-weight:900;font-size:34px;line-height:1;text-align:right}
.ovr span{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.1em;color:#4d6a5d}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:4px}
.stat{border:1.5px solid #c9c2a8;border-radius:3px;padding:3px 6px;line-height:1.3}
.stat b{display:block;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.stat i{display:block;font-style:normal;font-size:10.5px;line-height:1.2;color:#4d6a5d;overflow-wrap:anywhere}
.stat.sv{border-color:#d0571f}
.stat.sv i{color:#a8441a}
.stat.wide{grid-column:span 2}
.stat em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:#4d6a5d}
.stat.t90{border:3px solid #c99a1e;background:#fbefc8}
.stat.t75{border:3px solid #c8372d}
.stat.t50{border:3px solid #2f8f4e}
.legend{display:inline-flex;gap:8px;flex-wrap:wrap;margin-left:8px;letter-spacing:0;text-transform:none;font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;border:3px solid}
.spopt{flex-direction:row;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--chalk);font-size:14px}
.spopt .spn{flex:1;min-width:8em;font-weight:700}
.spopt:has(input:disabled){opacity:.45;cursor:not-allowed}
.statlabel{font-size:10.5px;letter-spacing:.1em;margin-top:2px;font-weight:700;color:#4d6a5d;text-transform:uppercase}
.facedown{background:repeating-linear-gradient(45deg,#1b5546 0 12px,#174c3e 12px 24px);border:2px dashed var(--line);border-radius:6px;min-height:340px;display:grid;place-items:center;text-align:center;padding:20px}
.facedown .q{font-family:var(--display);font-size:120px;font-weight:900;line-height:1;color:var(--line)}
/* the bid box stays on screen even when a long card pushes it down */
.bidbox{display:flex;flex-direction:column;gap:8px;margin-top:8px;position:sticky;bottom:0;z-index:5;box-shadow:0 -6px 16px rgba(0,0,0,.35)}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price .big{font-family:var(--display);font-weight:900;font-size:40px;line-height:1}
.turn{font-weight:700}
.log{max-height:180px;overflow:auto;font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:2px}
.log div b{color:var(--chalk);font-weight:500}

/* game */
.linescore{overflow-x:auto}
.linescore table{border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:100%}
.linescore th,.linescore td{padding:6px 8px;text-align:center;border:1px solid var(--line);min-width:34px}
.linescore td.tn{text-align:left;font-family:var(--body);font-weight:700;white-space:nowrap}
.linescore th{color:var(--dim);font-weight:400;font-size:12px}
.linescore td.tot{font-weight:600;background:var(--panel2)}
.pbp{background:var(--board);border:2px solid var(--line);border-radius:4px;padding:14px;max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:15px}
.pbp .half{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.03em;margin-top:12px;padding-top:8px;border-top:1px solid var(--line)}
.pbp .half:first-child{margin-top:0;border-top:0}
.pbp .pa{padding-left:12px;border-left:3px solid transparent}
.pbp .pa.run{border-left-color:var(--good)}
.pbp .pa.hr{border-left-color:var(--red);font-weight:700}
.pbp .note{color:var(--dim);font-size:13px;padding-left:12px}
.pbp .sc{font-family:var(--mono);font-size:12px;color:var(--good);margin-left:6px}
.reveal{text-align:center;padding:28px 18px;border:3px solid var(--chalk);border-radius:4px;background:var(--panel2)}
.reveal .w{font-family:var(--display);font-weight:900;font-size:clamp(40px,8vw,84px);line-height:1;text-transform:uppercase}
.reveal.flash{animation:pop .7s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.reveal.flash{animation:none}}
.box{overflow-x:auto}
.box table{border-collapse:collapse;width:100%;font-size:13px}
.box th,.box td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.box th:first-child,.box td:first-child{text-align:left;font-family:var(--body)}
.box th{color:var(--dim);font-weight:400}
.lineup{display:grid;grid-template-columns:auto auto 1fr auto;gap:2px 10px;font-size:14px}
.lineup .k{font-family:var(--mono);color:var(--dim)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;font-weight:500;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--board);font-weight:700}
.panel.soon{border-style:dashed;opacity:.75}
.lobbybar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lobbybar #lobbyask{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:700}
.lobbybar #lobbyask[hidden]{display:none}
.lobbybar button{padding:6px 12px}
.netbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:6px 12px}
.netbar .dot{width:9px;height:9px;border-radius:50%;background:var(--good)}
.netbar .warn{color:var(--amber)}
.netbar .sync{color:var(--amber);font-family:var(--mono);font-size:12px}
.netbar .sync.ok{color:var(--dim)}
.follow{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--panel2);border-top:3px solid var(--amber);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-weight:700}
.waiting{color:var(--dim);font-weight:500}
.sta{display:inline-block;width:64px;height:8px;border-radius:4px;background:var(--board);border:1px solid var(--line);overflow:hidden;vertical-align:middle}
.sta i{display:block;height:100%}
.stan{font-size:12px;color:var(--dim);min-width:3.2em}
.penlist{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;font-size:13px}
.lued{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.lurow{display:grid;grid-template-columns:2.4em 2.4em minmax(0,1fr) auto;gap:6px;align-items:center;border-radius:3px}
.lurow.picked{background:var(--panel2);outline:2px solid var(--amber)}
.lunum{padding:5px 0;border-color:var(--line);font-weight:700}
.lurow.picked .lunum{background:var(--amber);color:#1d1606;border-color:var(--amber)}
.lurow select{padding:5px 6px;font-size:13px}
.lupos{color:var(--amber)}
.warn{font-size:12px;color:var(--red);white-space:nowrap}
button.mini{padding:3px 8px;font-size:13px}
.gstat{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.gp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.decide{border-color:var(--amber)}
.optlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;text-align:left;border-color:var(--line);font-weight:700}
.opt:hover{border-color:var(--amber)}
.opt .hint{font-weight:400}
.sugg{font-size:11px;font-weight:700;background:var(--amber);color:#1d1606;padding:1px 6px;border-radius:2px}
.autolbl{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.series{font-family:var(--mono);color:var(--dim);font-size:13px}
/* ---------- same device, touch screen: roster | bid | card | bid | roster ---------- */
.draft.duo{grid-template-columns:minmax(0,.9fr) minmax(0,.8fr) minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.9fr);gap:8px;align-items:start}
.draft.duo .lotcol{order:0}
.draft.duo .duoside{position:sticky;top:8px;align-self:start;margin-top:40px}
.draft.duo .duobid{position:static;box-shadow:none;margin-top:0;padding:10px;gap:6px}
.draft.duo .duobid .price .big{font-size:32px}
.draft.duo .duobid.active{border-color:var(--amber)}
.draft.duo .duobid.B.active{border-color:var(--sky)}
.draft.duo .duobid:not(.active){opacity:.7}
.draft.duo .duobid .bidrow{flex-wrap:wrap;gap:6px}
.draft.duo .duobid .bidrow input{width:100%!important}
.draft.duo .duobid .bidrow button{flex:1 1 40%;padding:8px 4px}
.draft.duo .duobid .hint{font-size:11.5px}
.draft.duo .teamcard{padding:8px 10px}
.draft.duo .teamcard h2{font-size:17px}
.draft.duo .teamcard .money{font-size:28px}
.draft.duo .slots{font-size:11px;gap:0 5px}
.draft.duo .card{padding:8px 10px}
.draft.duo .card .stats{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}
/* phone held sideways: little height, so the header shrinks and the bid area tightens */
@media (max-height:520px){
  body.duo{padding-block:6px 16px}
  .wrap.duo{gap:6px}
  .wrap.duo header.top{padding-bottom:2px;border-bottom-width:2px}
  .wrap.duo h1{font-size:18px}
  .wrap.duo h1 small,.wrap.duo .src{display:none}
  .wrap.duo .lobbybar button{padding:2px 8px;font-size:12px}
  .draft.duo .duoside{margin-top:0;top:4px}
  .draft.duo .duobid{padding:7px 8px;gap:3px}
  .draft.duo .duobid .price .big{font-size:24px}
  .draft.duo .duobid .bidrow+.hint{display:none}
  .draft.duo .duobid .bidrow{gap:4px}
  .draft.duo .duobid .bidrow input{padding:4px 6px}
  .draft.duo .duobid .bidrow button{padding:5px 4px;font-size:13px}
  .draft.duo .teamcard h2{font-size:15px}
  .draft.duo .teamcard .money{font-size:22px}
}
/* ---------- phones ---------- */
.mobonly{display:none}
@media (pointer:coarse){input,select{font-size:16px}}   /* iOS zooms into smaller inputs */
@media (max-width:700px){
  body{padding-block:10px 24px}
  .wrap{gap:12px}
  header.top{gap:6px 10px;align-items:center;padding-bottom:6px}
  h1{font-size:24px}
  h1 small{font-size:11.5px;margin-top:3px}
  .src{font-size:10.5px}
  .wrap.s-draft .src,.wrap.s-game .src,.wrap.s-battle .src,.wrap.s-pick .src{display:none}
  .lobbybar button{padding:4px 10px;font-size:13px}
  .panel{padding:12px}
  .mobonly{display:block}
  .budgets{font-size:13px;font-weight:700}
  .card{padding:10px 12px}
  .stats{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
  .stat b{font-size:13px}
  .stat i{font-size:10px}
  .bidbox{padding:10px 12px;gap:6px}
  .bidbox .row{flex-wrap:nowrap;gap:5px}
  .bidbox input{width:58px!important;padding:6px;min-width:0}
  .bidbox button{padding:7px 8px;font-size:14px}
  .price{gap:6px}
  .price .big{font-size:30px}
  .turn{font-size:14px}
  .bidbox .hint{font-size:11.5px}
  .linescore th,.linescore td{padding:4px 2px;min-width:19px;font-size:12px}
  .linescore td.tn{max-width:62px;overflow:hidden;text-overflow:ellipsis}
  .box{padding:10px 8px}
  .box th,.box td{padding:4px 2px;font-size:11px;letter-spacing:-.02em}
  .box th:first-child,.box td:first-child{max-width:84px;overflow:hidden;text-overflow:ellipsis}
  .opt{padding:8px 10px}
  .reveal{padding:18px 12px}
}
</style>

<script>
const DATA=/*POOL*/{"season":"","source":"","players":[]};
const POOLS={NBA:DATA.players};
let POOL=POOLS.NBA;
/* ---------- language: 中文 / English, remembered on this device (shared with the baseball page) ---------- */
let LANG=(()=>{try{const v=localStorage.getItem('mlbLang');if(v==='en'||v==='zh')return v}catch(e){}return /^zh/i.test(navigator.language||'')?'zh':'en'})();
document.documentElement.lang=LANG==='en'?'en':'zh-Hant';
const TR=(zh,en)=>LANG==='en'?en:zh;   // pick the text for the current language
const ord=n=>{const t=['th','st','nd','rd'],v=n%100;return n+(t[(v-20)%10]||t[v]||t[0])};
// a lookup table whose values follow the current language
const biMap=(zh,en)=>new Proxy(zh,{get:(t,k)=>LANG==='en'&&en[k]!=null?en[k]:t[k]});
const TEAMZH=biMap({ATL:'老鷹',BOS:'塞爾提克',BKN:'籃網',BRK:'籃網',CHA:'黃蜂',CHO:'黃蜂',CHI:'公牛',CLE:'騎士',DAL:'獨行俠',DEN:'金塊',DET:'活塞',GSW:'勇士',
  HOU:'火箭',IND:'溜馬',LAC:'快艇',LAL:'湖人',MEM:'灰熊',MIA:'熱火',MIL:'公鹿',MIN:'灰狼',NOP:'鵜鶘',NYK:'尼克',OKC:'雷霆',ORL:'魔術',PHI:'76人',
  PHO:'太陽',PHX:'太陽',POR:'拓荒者',SAC:'國王',SAS:'馬刺',TOR:'暴龍',UTA:'爵士',WAS:'巫師','2TM':'兩隊','3TM':'三隊','4TM':'四隊',TOT:'多隊'},
 {ATL:'Hawks',BOS:'Celtics',BKN:'Nets',BRK:'Nets',CHA:'Hornets',CHO:'Hornets',CHI:'Bulls',CLE:'Cavaliers',DAL:'Mavericks',DEN:'Nuggets',DET:'Pistons',GSW:'Warriors',
  HOU:'Rockets',IND:'Pacers',LAC:'Clippers',LAL:'Lakers',MEM:'Grizzlies',MIA:'Heat',MIL:'Bucks',MIN:'Timberwolves',NOP:'Pelicans',NYK:'Knicks',OKC:'Thunder',ORL:'Magic',PHI:'76ers',
  PHO:'Suns',PHX:'Suns',POR:'Trail Blazers',SAC:'Kings',SAS:'Spurs',TOR:'Raptors',UTA:'Jazz',WAS:'Wizards','2TM':'2 teams','3TM':'3 teams','4TM':'4 teams',TOT:'several teams'});
const POSZH=biMap({G:'後衛',F:'前鋒',C:'中鋒',BN:'替補'},{G:'guard',F:'forward',C:'center',BN:'bench'});
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rnd=Math.random;
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const nm=p=>LANG==='en'?p.n:(p.zh||p.n);
const pct=x=>x==null?'—':(x*100).toFixed(1)+'%';
const f1=x=>x==null?'—':(+x).toFixed(1);
const sid=x=>String(x);
const elig=p=>p.pos.split('-');            // positions he is listed at: G, F, C
const grp=p=>elig(p)[0];                    // his main one, for ranking

/* ---------- per-36 rates, each pulled toward his position's average by minutes played ---------- */
const K_MIN=500;
const RATE_KEYS=['fga','fg3a','fta','tov','oreb','dreb','ast','stl','blk','pf','pts'];
function derive(pool){
  const base={};
  for(const g of ['G','F','C']){
    const q=pool.filter(p=>grp(p)===g),m=q.reduce((s,p)=>s+p.min,0)||1,sum=k=>q.reduce((s,p)=>s+p[k],0);
    base[g]={};RATE_KEYS.forEach(k=>base[g][k]=sum(k)/m*36);
    base[g].m2=(sum('fgm')-sum('fg3m'))/Math.max(1,sum('fga')-sum('fg3a'));base[g].m3=sum('fg3m')/Math.max(1,sum('fg3a'));base[g].ft=sum('ftm')/Math.max(1,sum('fta'));
  }
  for(const p of pool){
    const b=base[grp(p)],w=p.min/(p.min+K_MIN),r={};
    RATE_KEYS.forEach(k=>r[k]=w*p[k]/p.min*36+(1-w)*b[k]);
    r.m2=(p.fgm-p.fg3m+150*b.m2)/(p.fga-p.fg3a+150);r.m3=(p.fg3m+100*b.m3)/(p.fg3a+100);r.ft=(p.ftm+50*b.ft)/(p.fta+50);
    r.u=r.fga+.44*r.fta+r.tov;                       // possessions he ends, per 36
    r.dd=(p.dbpm??0)*w;                              // defense, from DBPM, trusted more with more minutes
    p.r=r;p.mpg=p.min/p.gp;
    // Hollinger's game score per 36, plus box plus/minus where the source has it
    const gs=p.pts+.4*p.fgm-.7*p.fga-.4*(p.fta-p.ftm)+.7*p.oreb+.3*p.dreb+p.stl+.7*p.ast+.7*p.blk-.4*p.pf-p.tov;
    p.raw=w*gs/p.min*36+(1-w)*8+(p.bpm??0)*.6*w;
  }
}
// the rating: rank among his own position, read off the same curve as the baseball game
const OVR_CURVE=[[0,45],[20,58],[50,68],[80,80],[90,86],[97,93],[100,99]];
function rankPct(a,v){let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<v)lo=m+1;else hi=m}return a.length>1?Math.min(100,lo/(a.length-1)*100):50}
function curveOvr(pr){for(let i=1;i<OVR_CURVE.length;i++){const [x1,y1]=OVR_CURVE[i-1],[x2,y2]=OVR_CURVE[i];if(pr<=x2)return y1+(y2-y1)*(pr-x1)/(x2-x1)}return 99}
function buildOvr(){for(const g of ['G','F','C']){const q=POOL.filter(p=>grp(p)===g),a=q.map(p=>p.raw).sort((x,y)=>x-y);q.forEach(p=>p.ovr=Math.round(clamp(curveOvr(rankPct(a,p.raw)),40,99)))}}
const ovr=p=>p.ovr;
/* ---------- percentile ranks for the stat boxes, within the position ---------- */
const pg=k=>p=>p[k]/p.gp;
const STATK={ppg:pg('pts'),rpg:p=>(p.oreb+p.dreb)/p.gp,apg:pg('ast'),spg:pg('stl'),bpg:pg('blk'),mpg:p=>p.mpg,
  fgp:p=>p.fga?p.fgm/p.fga:null,tpp:p=>p.fg3a>=50?p.fg3m/p.fg3a:null,ftp:p=>p.fta>=30?p.ftm/p.fta:null,
  ts:p=>p.pts/(2*(p.fga+.44*p.fta)||1),usg:p=>p.usg,bpm:p=>p.bpm,obpm:p=>p.obpm,dbpm:p=>p.dbpm,p36:p=>p.r.pts,ato:p=>p.ast/Math.max(1,p.tov),tpr:p=>p.fga?p.fg3a/p.fga:null};
let PRS={};
function buildPRS(){for(const g of ['G','F','C']){PRS[g]={};const q=POOL.filter(p=>grp(p)===g);for(const k in STATK)PRS[g][k]=q.map(STATK[k]).filter(v=>v!=null&&!isNaN(v)).sort((a,b)=>a-b)}}
function prOf(p,k,low){const a=PRS[grp(p)][k],v=STATK[k](p);if(v==null||!a||!a.length)return null;
  let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<v)lo=m+1;else hi=m}
  let lo2=lo,hi2=a.length;while(lo2<hi2){const m=(lo2+hi2)>>1;if(a[m]<=v)lo2=m+1;else hi2=m}
  const r=(lo+lo2)/2/a.length*100;return clamp(Math.round(low?100-r:r),0,100)}
let LGD=null;   // league baselines the game engine compares lineups against
function setLeague(lg){
  S.league='NBA';if(!POOL.done){derive(POOL);buildOvr();buildPRS();POOL.done=1}
  if(!LGD)LGD=leagueBase();
  fixSlots();
}

const S={screen:'home',teams:[
  {name:'',park:0,budget:200,roster:[],done:false},
  {name:'',park:1,budget:200,roster:[],done:false}],
  budget:200,lotMax:30,league:'NBA',slots:{BN:3},deck:[],lotNo:0,lot:null,log:[],speed:300,mode:'single'};

// starting five: two guards, two forwards, a center; then 0-3 bench players of any position, set before the draft
const SLOTS=[{k:'G',min:2,max:2},{k:'F',min:2,max:2},{k:'C',min:1,max:1},{k:'BN',min:0,max:3}];
const SLOT_KEYS=['BN'];
const slotMin=sl=>SLOT_KEYS.includes(sl.k)?(S.slots[sl.k]??0):sl.min;
const slotMax=sl=>SLOT_KEYS.includes(sl.k)?(S.slots[sl.k]??0):sl.max;
function slotRange(k){return [0,3]}
function fixSlots(){SLOT_KEYS.forEach(k=>{const [lo,hi]=slotRange(k);S.slots[k]=clamp(S.slots[k]??lo,lo,hi)})}
const slotPickers=dis=>`<label class="slotpick">${TR('替補人數','Bench players')}<select data-slot="BN" ${dis?'disabled':''}>${[0,1,2,3].map(n=>`<option value="${n}" ${S.slots.BN===n?'selected':''}>${n}</option>`).join('')}</select></label>`;
// enough lots that both teams can fill every required spot with room to spare
const lotsNeeded=()=>2*SLOTS.reduce((a,sl)=>a+slotMin(sl),0)+8;
function slotCount(t,k){return t.roster.filter(r=>r.slot===k).length}
function minRemaining(t){return SLOTS.reduce((s,sl)=>s+Math.max(0,slotMin(sl)-slotCount(t,sl.k)),0)}
function openSlotsFor(t,p,ignoreDone){
  if(t.done&&!ignoreDone) return [];
  return [...elig(p),'BN'].filter(k=>slotCount(t,k)<slotMax(SLOTS.find(s=>s.k===k)));   // his own positions first, then the bench
}
function needsCovered(t,p,slots){return slots.filter(k=>slotCount(t,k)<slotMin(SLOTS.find(s=>s.k===k))).length}
function maxBid(t,p){
  const slots=openSlotsFor(t,p); if(!slots.length) return 0;
  return Math.max(0,t.budget-(minRemaining(t)-needsCovered(t,p,slots)));
}
function canMeetMin(t){return SLOTS.every(sl=>slotCount(t,sl.k)>=slotMin(sl))}
function placeSlot(p,slots){return {slot:slots[0]}}

/* ---------- computer opponent (single-player) ---------- */
const AI_LV={
  easy:{get label(){return TR('簡單','Easy')},get hint(){return TR('出價保守、判斷粗略，交易時稍微吃虧也會接受。','Bids cautiously, judges loosely, and accepts trades that cost it a little.')},scale:.8,noise:.4,accept:-3},
  normal:{get label(){return TR('普通','Normal')},get hint(){return TR('照球員價值出價，交易只接受不吃虧的。','Bids what players are worth and only accepts fair trades.')},scale:1,noise:.2,accept:0},
  hard:{get label(){return TR('困難','Hard')},get hint(){return TR('敢搶球星、判斷精準，交易要占便宜才接受。','Goes after stars, judges sharply, and only accepts trades it wins.')},scale:1.12,noise:.08,accept:2}};
let aiTimer=null;
function scheduleAI(){clearTimeout(aiTimer);if(S.ai&&S.screen==='draft'&&S.lot&&S.lot.turn===S.ai.seat)aiTimer=setTimeout(aiAct,S.aiFast?0:300+Math.random()*300)}
// what the computer is willing to pay for this player right now
function aiValue(t,p){
  const lv=AI_LV[S.ai.level],slots=openSlotsFor(t,p);if(!slots.length)return 0;
  const need=needsCovered(t,p,slots)>0,q=clamp((ovr(p)-50)/49,0,1),req=minRemaining(t);
  let v=1+S.budget*.24*q*q;                                   // a 99 is worth about a quarter of the starting budget
  v=Math.min(v,(t.budget/Math.max(1,req))*(need?3:1.2));     // keep enough money for the spots still empty
  if(!need)v*=.45;                                           // depth beyond the minimum roster matters less
  if(need&&S.lotMax-S.lotNo<req*2)v*=1.4;                     // few lots left: pay up for a spot it must fill
  const pace=t.budget/Math.max(1,S.budget*Math.max(0,S.lotMax-S.lotNo)/S.lotMax);
  if(pace>1.2)v*=Math.min(2.2,pace*.8);                        // more money left than the remaining lots need: spend it
  v*=lv.scale*(1+(Math.random()*2-1)*lv.noise);
  return Math.max(need?1:0,Math.floor(v));
}
function aiAct(){
  const L=S.lot;if(!S.ai||S.screen!=='draft'||!L||L.turn!==S.ai.seat)return;
  const t=S.teams[S.ai.seat],mb=maxBid(t,L.p);
  if(L.aiv==null)L.aiv=aiValue(t,L.p);                       // decided once per player, so it doesn't waver mid-auction
  const cap=Math.min(L.aiv,mb);
  if(mustBid())return bid(L.price+1);
  if(L.price+1>cap)return pass();
  const room=cap-L.price;
  bid(L.price+(L.price===0&&room>6?Math.max(1,Math.round(cap*.4)):Math.min(room,room>10?3:1)));
}
function aiTradeReply(){
  const T=S.trade,q=T&&T.pending;if(!S.ai||S.screen!=='trade'||!q||q.pi===S.ai.seat)return;
  const ai=S.ai.seat,A=S.teams[q.pi],B=S.teams[ai],get=A.roster[q.a].p,give=B.roster[q.b].p;
  const r=tradeResult(q.pi,q.a,ai,q.b),gain=ovr(get)-ovr(give);
  if(r&&gain>=AI_LV[S.ai.level].accept){A.roster=r[0];B.roster=r[1];T.log.unshift(TR(`✅ 電腦接受：${esc(A.name)} 的 ${esc(nm(get))} ⇄ ${esc(B.name)} 的 ${esc(nm(give))}`,`✅ Computer accepts: ${esc(A.name)}'s ${esc(nm(get))} ⇄ ${esc(B.name)}'s ${esc(nm(give))}`))}
  else T.log.unshift(TR(`❌ 電腦拒絕了 ${esc(nm(get))} ⇄ ${esc(nm(give))}，覺得不划算`,`❌ Computer turns down ${esc(nm(get))} ⇄ ${esc(nm(give))}: not worth it`));
  T.pending=null;T.sel=[null,null];render();
}

/* ---------- draft ---------- */
function nextLot(){
  if(S.teams.every(t=>t.done||SLOTS.every(sl=>slotCount(t,sl.k)>=slotMax(sl)))) return endDraft();
  const over=S.lotNo>=S.lotMax;
  if(over&&S.teams.every(canMeetMin)) return endDraft();
  const needAll=S.teams.reduce((s,t)=>s+minRemaining(t),0);
  const tight=over||(S.lotMax-S.lotNo)<=needAll+2;
  let idx=S.deck.findIndex(p=>S.teams.some(t=>{const sl=openSlotsFor(t,p);return sl.length&&maxBid(t,p)>=1&&(!tight||needsCovered(t,p,sl)>0)}));
  if(idx<0){ if(S.teams.every(canMeetMin)) return endDraft(); S.screen='stuck'; return render(); }
  const p=S.deck.splice(idx,1)[0];S.tail=(S.tail||[]).filter(id=>sid(id)!==sid(p.id));
  S.lotNo++;
  const first=(S.lotNo-1)%2;
  S.lot={p,price:0,high:null,turn:first,passed:[false,false],fresh:true};
  advanceAuto();
  render();
}
function eligible(i){const t=S.teams[i],L=S.lot;return openSlotsFor(t,L.p).length>0&&maxBid(t,L.p)>L.price}
function advanceAuto(){ // skip players who cannot act
  const L=S.lot;
  for(let guard=0;guard<4;guard++){
    if(L.high!=null && L.turn===L.high) return award(); // other side passed
    if(!eligible(L.turn)){ L.passed[L.turn]=true; if(L.high!=null) return award(); if(L.passed[1-L.turn]) return unsold(); L.turn=1-L.turn; continue;}
    return;
  }
}
function bid(amount){
  const L=S.lot,i=L.turn,t=S.teams[i];
  if(!(amount>L.price&&amount<=maxBid(t,L.p))) return;
  L.price=amount;L.high=i;L.turn=1-i;L.fresh=false;
  S.log.unshift(`<b class="${i?'tb':'ta'}">${esc(t.name)}</b> ${TR('出價','bids')} $${amount}`);
  advanceAuto();render();
}
function mustBid(){const L=S.lot,t=S.teams[L.turn];if(!L||L.high!=null||S.lotNo<=S.lotMax)return false;const sl=openSlotsFor(t,L.p);return needsCovered(t,L.p,sl)>0}
function pass(){
  if(mustBid()) return;
  const L=S.lot,i=L.turn;L.passed[i]=true;L.fresh=false;
  S.log.unshift(`<b class="${i?'tb':'ta'}">${esc(S.teams[i].name)}</b> ${TR('放棄加價','passes')}`);
  if(L.high!=null) return award();
  if(L.passed[1-i]) return unsold();
  L.turn=1-i;advanceAuto();render();
}
function award(){
  const L=S.lot,t=S.teams[L.high],slots=openSlotsFor(t,L.p,true);
  t.budget-=L.price;
  const entry={p:L.p,price:L.price,...placeSlot(L.p,slots)};
  t.roster.push(entry);
  S.log.unshift(TR(`🏀 <b>${esc(nm(L.p))}</b> 由 <b class="${L.high?'tb':'ta'}">${esc(t.name)}</b> 以 $${L.price} 得標${L.p.twp?`（二刀流：${slots.map(k=>POSZH[k]).join('＋')}）`:''}`,
    `🏀 <b>${esc(nm(L.p))}</b> goes to <b class="${L.high?'tb':'ta'}">${esc(t.name)}</b> for $${L.price}${L.p.twp?` (two-way: ${slots.map(k=>POSZH[k]).join(' + ')})`:''}`));
  S.lot=null;nextLot();
}
function unsold(){
  const p=S.lot.p;S.log.unshift(TR(`${esc(nm(p))} 流標`,`${esc(nm(p))} goes unsold`));
  // a player some team still needs goes back into the draw, so thin positions (CPBL closers) can still be filled
  if(S.teams.some(t=>{const sl=openSlotsFor(t,p,true);return needsCovered(t,p,sl)>0})){S.deck.push(p);(S.tail=S.tail||[]).push(p.id)}
  S.lot=null;nextLot()}
function declareDone(i){S.teams[i].done=true;S.log.unshift(`<b class="${i?'tb':'ta'}">${esc(S.teams[i].name)}</b> ${TR('宣布陣容完成','declares the roster done')}`);
  if(S.lot){ if(S.lot.high===i){/* keep their bid */} advanceAuto(); if(S.lot) render(); } }

function tradeResult(pi,ai,oi,bi){
  const A=S.teams[pi],B=S.teams[oi],xa=A.roster[ai],yb=B.roster[bi];
  const ta={roster:A.roster.filter(e=>e!==xa)},tb={roster:B.roster.filter(e=>e!==yb)};
  const put=(t,e)=>{const sl=openSlotsFor(t,e.p,true);if(!sl.length)return false;
    t.roster.push({p:e.p,price:e.price,...placeSlot(e.p,sl),traded:true});return true};
  if(!put(ta,yb)||!put(tb,xa)) return null;
  if(!canMeetMin(ta)||!canMeetMin(tb)) return null;
  return [ta.roster,tb.roster];
}

    const q=T.pending,A=S.teams[q.pi],B=S.teams[1-q.pi],an=nm(A.roster[q.a].p),bn=nm(B.roster[q.b].p);
    $('#tacc').onclick=()=>{const r=tradeResult(q.pi,q.a,1-q.pi,q.b);if(r){A.roster=r[0];B.roster=r[1];T.log.unshift(TR(`✅ 成交：${esc(A.name)} 的 ${esc(an)} ⇄ ${esc(B.name)} 的 ${esc(bn)}`,`✅ Done deal: ${esc(A.name)}'s ${esc(an)} ⇄ ${esc(B.name)}'s ${esc(bn)}`))}T.pending=null;T.sel=[null,null];sync();render()};

  }

}

/* ---------- line-ups ---------- */
const STARTS=['G','G','F','F','C'];
const teamPlayers=i=>S.teams[i].roster.map(r=>r.p);
const em=e=>.85+.15*e/100;      // how much of himself a tired player still is, when choosing who plays
const PERMS5=(()=>{const out=[],go=(a,r)=>{if(!r.length)return out.push(a);r.forEach((x,k)=>go([...a,x],[...r.slice(0,k),...r.slice(k+1)]))};go([],[0,1,2,3,4]);return out})();
// the best five for the five spots: rating and freshness, minus a cost for each player out of position
function bestFive(players,fit){
  let best=null;const n=players.length,idx=[];
  const val=p=>p.ovr*em(fit[sid(p.id)]??100);
  const tryCombo=c=>{for(const pm of PERMS5){let v=0;for(let k=0;k<5;k++){const p=c[pm[k]];v+=val(p)-(elig(p).includes(STARTS[k])?0:8)}
    if(!best||v>best.v)best={v,ids:pm.map(k=>c[k].id)}}};
  const rec=(start,c)=>{if(c.length===5)return tryCombo(c);for(let k=start;k<n;k++)rec(k+1,[...c,players[k]])};
  rec(0,[]);
  return best?best.ids:players.slice(0,5).map(p=>p.id);
}
function defaultLineup(i,g){return bestFive(teamPlayers(i),fitnessMap(i,g))}
function validLineup(i,lu){
  if(!Array.isArray(lu)||lu.length!==5)return false;
  const ids=new Set(teamPlayers(i).map(p=>sid(p.id)));
  return lu.every(x=>ids.has(sid(x)))&&new Set(lu.map(sid)).size===5;
}
// freshness at the start of game g, from minutes played in the two games before it
function fitnessMap(i,g){
  const m={};
  for(let k=1;k<=2&&g-k>=0;k++){const mins=gameResult(g-k).mins||{},w=[.35,.12][k-1];for(const id in mins)m[id]=(m[id]||0)+mins[id]*w}
  const out={};for(const p of teamPlayers(i))out[sid(p.id)]=clamp(Math.round(100-(m[sid(p.id)]||0)),50,100);
  return out;
}
const staColor=v=>v>=70?'var(--good)':v>=50?'var(--amber)':'var(--red)';
const staBar=v=>`<span class="sta" title="${TR('體力','Energy')} ${v}%"><i style="width:${v}%;background:${staColor(v)}"></i></span><span class="mono stan">${v}%</span>`;

/* ---------- simulation engine: one possession at a time ---------- */
// league baselines a lineup is measured against
function leagueBase(){
  const W=POOL.reduce((s,p)=>s+p.min,0),avg=k=>POOL.reduce((s,p)=>s+p.r[k]*p.min,0)/W;
  return {stl5:5*avg('stl'),blk5:5*avg('blk'),dd:avg('dd')};
}
const TACL=()=>({bal:TR('平衡','Balanced'),inside:TR('主攻內線','Attack the paint'),three:TR('狂投三分','Bomb threes'),defense:TR('加強防守','Lock down'),pace:TR('快攻跑轟','Run and gun')});
const TACK=['bal','inside','three','defense','pace'];
// what each approach changes: share of threes, finishing, free throws, turnovers, the opponent's shooting and ball security,
// how fast players tire, and how long a possession takes
const TACFX={bal:{},inside:{p3:.7,m2:1.015,ft:1.1},three:{p3:1.35,m3:.985},defense:{oppM:.98,oppTov:1.04,drain:1.2},pace:{time:.82,m2:1.03,tov:1.05,oppM:1.005,drain:1.15}};
const fx=(t,k)=>(TACFX[t]&&TACFX[t][k])||1;
const CAL=1.025;    // overall shooting, tuned so the real clubs' rotations score about the league's 115 a game
const QSEC=720,OTSEC=300;
const wpick=(xs,wf)=>{let tot=0;for(const x of xs)tot+=Math.max(0,wf(x));let r=rnd()*tot;for(const x of xs){r-=Math.max(0,wf(x));if(r<=0)return x}return xs[xs.length-1]};
const periodName=q=>q<4?TR(`第 ${q+1} 節`,`Q${q+1}`):TR(`延長賽${q>4?' '+(q-3):''}`,`OT${q>4?q-3:''}`);
const periodShort=q=>q<4?String(q+1):(q>4?'OT'+(q-3):'OT');
const clk=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
// ctx.dec: decisions made so far, keyed "break:team"; ctx.human[team]: does a person manage that team
function simGame(home,away,ctx){
  const sides=[home,away].map((tm,s)=>{
    const P=new Map();
    for(const p of tm.players)P.set(sid(p.id),{p,en:tm.fit[sid(p.id)]??100,st:{sec:0,pts:0,reb:0,ast:0,stl:0,blk:0,tov:0,fgm:0,fga:0,f3m:0,f3a:0,ftm:0,fta:0,pf:0,pm:0}});
    return {tm,s,P,on:tm.lu.map(id=>P.get(sid(id))),tac:TACFX[tm.tac]?tm.tac:'bal',score:0,q:[]};
  });
  const ev=[],dec=ctx.dec||{};
  let qn=0,clock=0,qlen=QSEC;
  const snap=()=>({q:qn,clk:Math.max(0,qlen-clock),sc:[sides[0].score,sides[1].score],line:sides.map(x=>x.q.slice()),
    on:sides.map(S_=>S_.on.map(x=>[x.p.id,Math.round(x.en),x.st.pts])),tac:sides.map(x=>x.tac)});
  const push=(t,c,k)=>ev.push({k:k||'pa',t,c,...snap()});
  const N=x=>nm(x.p);
  const score=(S_,pts)=>{S_.score+=pts;S_.q[qn]=(S_.q[qn]||0)+pts;for(const x of S_.on)x.st.pm+=pts;for(const x of sides[1-S_.s].on)x.st.pm-=pts};
  // the computer, and the suggestion shown to a person: by the score and the clock
  function aiTac(S_,b){
    const d=S_.score-sides[1-S_.s].score;
    if(b>=3)return d<-12?'three':d<-5?'pace':d>10?'defense':'bal';
    if(b===2)return d<-10?'pace':'bal';
    return 'bal';
  }
  function apply(S_,v){
    const [tac,ids]=String(v).split('|'),lu=(ids||'').split(',');
    const ok=lu.length===5&&new Set(lu).size===5&&lu.every(id=>S_.P.has(id));
    const before=new Set(S_.on.map(x=>sid(x.p.id)));
    if(ok)S_.on=lu.map(id=>S_.P.get(id));
    const ins=S_.on.filter(x=>!before.has(sid(x.p.id)));
    if(ins.length)push(TR(`🔁 ${S_.tm.name} 換上 ${ins.map(N).join('、')}`,`🔁 ${S_.tm.name} bring in ${ins.map(N).join(', ')}`),'','note');
    if(TACFX[tac]&&tac!==S_.tac){S_.tac=tac;push(TR(`📣 ${S_.tm.name} 改打「${TACL()[tac]}」`,`📣 ${S_.tm.name} switch to "${TACL()[tac]}"`),'','note')}
  }
  // between periods: each team sets its five and its approach. A person's choice is looked up; if it isn't in yet, the game pauses.
  function brk(b){
    const need=[],info={};
    for(const S_ of sides){
      const i=S_.tm.i,fitNow={};for(const x of S_.P.values())fitNow[sid(x.p.id)]=x.en;
      const sug=aiTac(S_,b)+'|'+bestFive([...S_.P.values()].map(x=>x.p),fitNow).join(',');
      if(!ctx.human[i]){apply(S_,sug);continue}
      const v=dec[b+':'+i];
      if(v!=null){apply(S_,v);continue}
      need.push(i);
      info[i]={sug,cur:S_.tac+'|'+S_.on.map(x=>x.p.id).join(','),pl:[...S_.P.values()].map(x=>({id:x.p.id,en:Math.round(x.en),pts:x.st.pts,min:Math.round(x.st.sec/60)}))};
    }
    if(need.length)throw {pause:{b,need,info,q:qn,sc:[sides[0].score,sides[1].score]},partial:{ev,home,away}};
  }
  function tick(dt){
    for(const S_ of sides){const on=new Set(S_.on),dr=fx(S_.tac,'drain');
      for(const x of S_.P.values()){if(on.has(x)){x.en=Math.max(25,x.en-1.55/60*dt*dr);x.st.sec+=dt}else x.en=Math.min(100,x.en+2/60*dt)}}
  }
  function possession(O,D,home){
    const fo=k=>fx(O.tac,k),fd=k=>fx(D.tac,k);
    const avgDD=D.on.reduce((s,x)=>s+x.p.r.dd*em(x.en),0)/5;
    const dq=clamp(1-.011*(avgDD-LGD.dd),.88,1.12);                 // the defense on the floor
    const stl=D.on.reduce((s,x)=>s+x.p.r.stl,0)/LGD.stl5,blk=D.on.reduce((s,x)=>s+x.p.r.blk,0)/LGD.blk5;
    let t=clamp(14.4*fo('time')*(.55+.9*rnd()),5,24);
    const parts=[];let reb=0;
    for(let tries=0;tries<4;tries++){
      const a=wpick(O.on,x=>x.p.r.u*(.9+.1*x.en/100)),r=a.p.r,tired=1.1-.1*a.en/100;
      const pT=r.tov/r.u*fo('tov')*fd('oppTov')*(.8+.2*stl)*tired*(home?1:1.02),pF=.44*r.fta/r.u*fo('ft'),pS=r.fga/r.u;
      const x=rnd()*(pT+pF+pS);
      if(x<pT){
        a.st.tov++;
        if(rnd()<.55){const s=wpick(D.on,y=>y.p.r.stl+.05);s.st.stl++;parts.push(TR(`${N(s)} 抄截 ${N(a)}`,`${N(s)} picks off ${N(a)}`))}
        else parts.push(TR(`${N(a)} 失誤`,`turnover by ${N(a)}`));
        return {t,text:parts.join('，'),c:''};
      }
      if(x<pT+pF){
        const f=wpick(D.on,y=>y.p.r.pf+.1);f.st.pf++;
        let m=0;for(let k=0;k<2;k++)if(rnd()<r.ft*(.97+.03*a.en/100))m++;
        a.st.fta+=2;a.st.ftm+=m;if(m)score(O,m);
        parts.push(TR(`${N(a)} 造成 ${N(f)} 犯規，兩罰${m===2?'俱中':m===1?'一中':'不中'}`,`${N(a)} draws a foul on ${N(f)}, ${m} of 2 at the line`));
        return {t,text:parts.join('，'),c:m?'run':''};
      }
      const three=rnd()<clamp(r.fg3a/r.fga*fo('p3'),0,.9);
      const mk=(three?r.m3*fo('m3'):r.m2*fo('m2'))*dq*fd('oppM')*CAL*(.93+.07*a.en/100)*(home?1.015:.985);
      a.st.fga++;if(three)a.st.f3a++;
      if(rnd()<mk){
        a.st.fgm++;if(three)a.st.f3m++;a.st.pts+=three?3:2;score(O,three?3:2);
        let ast=null;if(rnd()<(three?.82:.55)){const os=O.on.filter(y=>y!==a);ast=wpick(os,y=>y.p.r.ast+.2);ast.st.ast++}
        parts.push(TR(`${N(a)} ${three?'三分球命中！':'出手得分'}${ast?`（${N(ast)} 助攻）`:''}`,`${N(a)} ${three?'drains a three!':'scores'}${ast?` (assist ${N(ast)})`:''}`));
        return {t:t+reb*4,text:parts.join('，'),c:three?'hr':'run'};
      }
      let txt=TR(`${N(a)} ${three?'三分':'出手'}不進`,`${N(a)} misses${three?' from three':''}`);
      if(!three&&rnd()<.075*blk){const b=wpick(D.on,y=>y.p.r.blk+.05);b.st.blk++;txt=TR(`${N(a)} 出手被 ${N(b)} 封阻`,`${N(a)} is blocked by ${N(b)}`)}
      const oS=O.on.reduce((s,y)=>s+y.p.r.oreb*em(y.en),0),dS=D.on.reduce((s,y)=>s+y.p.r.dreb*em(y.en),0);
      if(rnd()<oS/(oS+dS)){const g=wpick(O.on,y=>y.p.r.oreb+.1);g.st.reb++;reb++;parts.push(txt+TR(`，${N(g)} 搶下進攻籃板`,`, ${N(g)} grabs the offensive board`));continue}
      const g=wpick(D.on,y=>y.p.r.dreb+.1);g.st.reb++;parts.push(txt+TR(`，${N(g)} 搶下籃板`,`, ${N(g)} rebounds`));
      return {t:t+reb*4,text:parts.join('，'),c:''};
    }
    return {t:t+reb*4,text:parts.join('，'),c:''};
  }
  // tip-off, then the periods; the team that lost the tip starts the 2nd and 3rd quarters
  const tip=rnd()<.5?0:1;
  push(TR(`🏀 跳球，${sides[tip].tm.name} 取得球權`,`🏀 Tip-off: ${sides[tip].tm.name} win it`),'','note');
  for(qn=0;;qn++){
    qlen=qn<4?QSEC:OTSEC;clock=0;
    if(qn>0){for(const S_ of sides)for(const x of S_.P.values())x.en=Math.min(100,x.en+(qn===2?12:4));brk(qn)}
    sides.forEach(S_=>S_.q[qn]=S_.q[qn]||0);
    push(periodName(qn),'','half');
    let o=qn===0||qn>=4?tip:(qn===1||qn===2?1-tip:tip);
    while(clock<qlen){
      const r=possession(sides[o],sides[1-o],o===0),dt=Math.min(r.t,qlen-clock);
      tick(dt);clock+=dt;
      push(TR(`${sides[o].tm.name}：`,`${sides[o].tm.name}: `)+r.text,r.c);
      o=1-o;
    }
    push(TR(`${periodName(qn)}結束：${home.name} ${sides[0].score}：${sides[1].score} ${away.name}`,`End of ${periodName(qn)}: ${home.name} ${sides[0].score}–${sides[1].score} ${away.name}`),'','end');
    if(qn>=3&&sides[0].score!==sides[1].score)break;
  }
  const mins={},box=sides.map(S_=>[...S_.P.values()].map(x=>{mins[sid(x.p.id)]=Math.round(x.st.sec/60);return {p:x.p,...x.st,min:Math.round(x.st.sec/60)}}));
  return {ev,home,away,line:sides.map(x=>x.q),R:[sides[0].score,sides[1].score],win:sides[0].score>sides[1].score,box,mins};
}

const MODEZH=biMap({single:'單場決勝',bo3:'三戰兩勝',bo7:'七戰四勝'},{single:'Single game',bo3:'Best of 3',bo7:'Best of 7'});

/* ---------- series: every game is replayed from its seed and recorded decisions, so all screens agree ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashSeed(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const RES_CACHE=new Map();
function rosterKey(){return S.teams.map(t=>t.roster.map(e=>e.p.id+e.slot).join('.')).join('|')}
const decKey=g=>'s'+S.series.id+'g'+g;
// decisions for game g, keyed "break:team" so both teams can decide at the same time
function decObj(g){
  if(!NET.on) return (S.series.games[g]&&S.series.games[g].dec)||{};
  return (NET.doc&&NET.doc.dec&&NET.doc.dec[decKey(g)])||{};
}
function teamFor(i,g,lu,tac){return {i,name:S.teams[i].name,players:teamPlayers(i),lu:validLineup(i,lu)?lu:defaultLineup(i,g),tac:TACFX[tac]?tac:'bal',fit:fitnessMap(i,g)}}
function gameResult(g){
  const gm=S.series.games[g],dec=decObj(g);
  const key=[gm.seed,JSON.stringify(gm.lu||[]),JSON.stringify(gm.tac||[]),JSON.stringify(dec),rosterKey(),S.ai?S.ai.seat:'-',LANG].join('/');
  if(RES_CACHE.has(key)) return RES_CACHE.get(key);
  const tms=[0,1].map(i=>teamFor(i,g,gm.lu&&gm.lu[i],gm.tac&&gm.tac[i]));
  const h=S.series.sched[g], old=rnd; rnd=mulberry32(gm.seed);
  let res;
  try{res=simGame(tms[h],tms[1-h],{dec,human:[0,1].map(i=>!(S.ai&&S.ai.seat===i))})}
  catch(e){if(!e||!e.pause)throw e;res={...e.partial,paused:e.pause}}
  finally{rnd=old}
  res.homeIdx=h; if(!res.paused) res.winIdx=(res.win?tms[h]:tms[1-h]).i;
  RES_CACHE.set(key,res); return res;
}
function winsThrough(n){const w=[0,0];for(let g=0;g<n;g++)w[gameResult(g).winIdx]++;return w}
const tname=i=>esc(S.teams[i].name);

/* ---------- before each game: starting five, approach ---------- */
function coinText(g){const s=S.series;
  if(S.mode==='single'||(S.mode==='bo3'&&g===2)) return TR(`擲硬幣結果：${tname(s.sched[g])} 取得主場。`,`Coin toss: ${tname(s.sched[g])} gets home court.`);
  if(S.mode==='bo7') return TR(`擲硬幣結果：${tname(s.coin)} 擁有主場優勢（第 1、2、5、7 戰在主場）。`,`Coin toss: ${tname(s.coin)} have home-court advantage (Games 1, 2, 5, 7 at home).`);
  return '';}
let LUED=[null,null],LUED_KEY='';
const pid=v=>v;
const pickKey=()=>'s'+S.series.id+'g'+S.game.gnum;
function lastPick(i,g){for(let k=g-1;k>=0;k--){const gm=S.series.games[k];if(gm.lu&&validLineup(i,gm.lu[i]))return {lu:gm.lu[i].slice(),tac:(gm.tac&&gm.tac[i])||'bal'}}return null}
function ensureLued(g){
  const k=pickKey();if(LUED_KEY===k)return;
  LUED_KEY=k;LUED=[0,1].map(i=>lastPick(i,g)||{lu:defaultLineup(i,g),tac:'bal'});
}
// the starting-five editor: a menu for each spot; choosing someone already in the five swaps the two

function submitDecision(i,v){

   ${rows.map(x=>`<tr><td>${esc(nm(x.p))}</td><td>${x.min}</td><td>${x.pts}</td><td>${x.reb}</td><td>${x.ast}</td><td>${x.stl}</td><td>${x.blk}</td><td>${x.tov}</td><td>${x.fgm}-${x.fga}</td><td>${x.f3m}-${x.f3a}</td><td>${x.ftm}-${x.fta}</td><td>${x.pm>0?'+':''}${x.pm}</td></tr>`).join('')}</tbody></table></section>`;

function mvp(res){

/* ---------- series totals ---------- */
function seriesStats(n){
  const T=[new Map(),new Map()];
  for(let g=0;g<n;g++){const r=gameResult(g);
    [r.home,r.away].forEach((tm,s)=>r.box[s].forEach(x=>{if(!x.min)return;const k=sid(x.p.id),a=T[tm.i].get(k)||{p:x.p,g:0,min:0,pts:0,reb:0,ast:0,stl:0,blk:0,fgm:0,fga:0,f3m:0,f3a:0,ftm:0,fta:0,tov:0,pf:0};
      a.g++;['min','pts','reb','ast','stl','blk','fgm','fga','f3m','f3a','ftm','fta','tov','pf'].forEach(f=>a[f]+=x[f]);T[tm.i].set(k,a)}))}
  return T.map(t=>[...t.values()]);

function seriesMvp(T,champ){

  return TR(`${nm(x.p)}：平均 ${(x.pts/x.g).toFixed(1)} 分 ${(x.reb/x.g).toFixed(1)} 籃板 ${(x.ast/x.g).toFixed(1)} 助攻`,`${nm(x.p)}: ${(x.pts/x.g).toFixed(1)} pts, ${(x.reb/x.g).toFixed(1)} reb, ${(x.ast/x.g).toFixed(1)} ast per game`);

/* ---------- online play: one shared room document ---------- */
// rooms expire 3 days after their last write; every write renews the stamp
const ROOM_TTL=3*864e5;
const roomExpired=d=>(d.exp||((d.created||0)+ROOM_TTL))<Date.now();
function roomDoc(code){
  const r=NET.db.doc('rooms/'+code),stamp=d=>({...d,exp:Date.now()+ROOM_TTL});
  return {get:()=>r.get(),onSnapshot:(a,b)=>r.onSnapshot(a,b),acquire:o=>r.acquire(o),set:d=>r.set(stamp(d)),update:d=>r.update(stamp(d))};
}
// opening the online menu clears out expired rooms, so old games don't pile up
async function sweepRooms(){
  try{
    const old=await NET.db.collection('rooms').where('exp','<',Date.now()).limit(20).get();
    for(const d of old.docs){try{await NET.db.doc('rooms/'+d.id).delete()}catch(e){}}
  }catch(e){}
}
const NET={on:false,status:'loading',msg:'',db:null,user:null,uid:null,ref:null,code:null,seat:null,doc:null,pending:null,unsub:null,err:''};
const BYID=new Map(POOLS.NBA.map(p=>[p.id,p]));
const isMine=i=>S.ai?i!==S.ai.seat:(!NET.on||NET.seat===i);
let wq=Promise.resolve();
function newDeckOrder(){S.deck0=S.deck.map(p=>p.id);S.deckKey=Math.random().toString(36).slice(2,8);S.tail=[]}
// the remaining draw as a small diff against the order sent at draft start
function deckDiff(){const cur=new Set(S.deck.map(p=>sid(p.id)));return {deckKey:S.deckKey,deckGone:(S.deck0||[]).filter(id=>!cur.has(sid(id))),deckTail:S.tail||[]}}
function deckFrom(o){
  if(o.deck) return o.deck.map(id=>BYID.get(id));
  const d0=NET.doc&&NET.doc.deck0;if(!d0||d0.k!==o.deckKey) return [];
  const gone=new Set((o.deckGone||[]).map(sid)),tail=o.deckTail||[],ts=new Set(tail.map(sid));
  S.deck0=d0.ids;return d0.ids.filter(id=>!gone.has(sid(id))&&!ts.has(sid(id))).concat(tail).map(id=>BYID.get(id));
}
// writes go out one at a time; the badge shows "sending" and how long the last one took
function dbWrite(fn){
  NET.pend=(NET.pend||0)+1;updateNetBadge();
  const t0=Date.now();
  wq=wq.then(fn).then(()=>{NET.lag=Date.now()-t0;NET.err=''},e=>{NET.err=(e&&e.code)==='invalid_argument'?TR('寫入被拒絕：你可能沒有編輯權限。','Write refused: you may not have edit access.'):TR('同步失敗，請重新整理頁面。','Sync failed. Reload the page.')})
    .finally(()=>{NET.pend--;updateNetBadge()});
  return wq;
}
// a phone that locks or switches apps pauses the page; on return, fetch the room at once instead of waiting for the reconnect
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&NET.on&&NET.ref)NET.ref.get().then(onRoom).catch(()=>{})});
function sync(){if(!NET.on||NET.seat==null)return;S.rev=Math.random().toString(36).slice(2);commitRaw()}
function commitRaw(){const st=JSON.stringify(dehydrate()),rev=S.rev;dbWrite(()=>NET.ref.update({state:st,rev}))}
function dehydrate(){return {v:1,league:S.league,slots:S.slots,screen:S.screen,mode:S.mode,lotMax:S.lotMax,budget:S.budget,
  teams:S.teams.map(t=>({name:t.name,park:t.park,budget:t.budget,done:!!t.done,roster:t.roster.map(e=>({id:e.p.id,price:e.price,slot:e.slot,slot2:e.slot2||null,traded:!!e.traded}))})),
  ...deckDiff(),lotNo:S.lotNo,lot:S.lot?{p:S.lot.p.id,price:S.lot.price,high:S.lot.high,turn:S.lot.turn,passed:S.lot.passed}:null,
  log:S.log.slice(0,20),trade:S.trade?{left:S.trade.left,prop:S.trade.prop,pending:S.trade.pending,log:S.trade.log.slice(0,15)}:null,
  series:S.series||null,gnum:S.game?S.game.gnum:0,rev:S.rev}}
function hydrate(o){
  const prevSel=S.trade&&S.trade.sel;
  // rebuilding the league tables takes a phone tens of milliseconds, so only when the league actually changes
  if(!POOL.done)setLeague('NBA');
  if(o.slots)S.slots={...o.slots};
  S.screen=o.screen;S.mode=o.mode;S.lotMax=o.lotMax;S.budget=o.budget;
  S.teams=o.teams.map(t=>({name:t.name,park:t.park,budget:t.budget,done:t.done,roster:t.roster.map(e=>({p:BYID.get(e.id),price:e.price,slot:e.slot,slot2:e.slot2||undefined,traded:e.traded}))}));
  S.deckKey=o.deckKey;S.tail=(o.deckTail||[]).slice();S.deck=deckFrom(o);S.lotNo=o.lotNo;S.lot=o.lot?{...o.lot,p:BYID.get(o.lot.p)}:null;
  S.log=o.log||[];S.trade=o.trade?{...o.trade,sel:prevSel||[null,null]}:null;
  S.series=o.series;S.game={gnum:o.gnum||0};S.rev=o.rev;
}
function onRoom(snap){
  if(!snap.exists){NET.err=TR('這個房間已經不存在。','This room no longer exists.');updateNetBadge();return}
  const d=snap.data();NET.doc=d;
  if(d.state&&d.rev!==S.rev&&!snap.metadata.hasPendingWrites){
    const st=JSON.parse(d.state);
    const watching=S.screen==='game'&&S.game&&S.game.res;
    if(watching&&st.screen==='game'&&st.gnum===S.game.gnum){const keep=S.game;hydrate(st);S.game=keep;S.screen='game'}
    else if(watching){NET.pending=d;showFollow()}
    else{hydrate(st);render()}
  }
  if(S.screen==='room'){if(!NET.drawn)renderRoom();else updateRoom()}
  // redraw the lineup screen only when something on it changed: a redraw closes a menu the player has open
  if(S.screen==='pick'){maybeFinalizePick();if(S.screen==='pick'){const sig=S.rev+'|'+JSON.stringify((d.picks||{})[pickKey()]||null);if(sig!==NET.pickSig){NET.pickSig=sig;renderPick()}}}
  if(S.screen==='game'&&S.game&&S.game.res&&S.game.res.paused&&S.game.pos>=S.game.res.ev.length){if(pausedResolved())resumeGame();else showDecision()}
  updateNetBadge();
}

function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
async function createRoom(){
  let code;for(let k=0;k<6;k++){code=genCode();const s=await NET.db.doc('rooms/'+code).get();if(!s.exists)break}
  await roomDoc(code).set({v:1,seats:{0:NET.uid},setup:{0:{name:'',park:0},1:{name:'',park:1}},cfg:{game:'nba',budget:200,lotMax:30,league:'NBA',mode:S.mode,slots:S.slots},picks:{},state:'',rev:'',created:Date.now()});
  enterRoom(code,0);
}
async function joinRoom(raw){
  const code=String(raw||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(code)) throw new Error(TR('房號是 4 個英文字母或數字。','Room codes are 4 letters or digits.'));
  const ref=roomDoc(code),s=await ref.get();
  if(!s.exists||roomExpired(s.data())) throw new Error(TR('找不到這個房號，請確認後再試一次。','No room with that code. Check it and try again.'));
  // the baseball and NBA pages share one set of rooms; a code from the other game is turned away
  if(((s.data().cfg||{}).game||'mlb')!=='nba') throw new Error(TR('這是棒球版的房號，請到棒球版的網頁加入。','That code belongs to the baseball game; join it there.'));
  const seats=s.data().seats||{};
  if(seats[0]===NET.uid) return enterRoom(code,0);
  if(seats[1]===NET.uid) return enterRoom(code,1);
  if(!seats[1]){
    const lease=await ref.acquire({holder:NET.uid,ttlMs:5000});
    if(lease.acquired){const d2=(await ref.get()).data();if(!d2.seats||!d2.seats[1]){await ref.update({seats:{1:NET.uid}});return enterRoom(code,1)}}
  }
  enterRoom(code,null);
}
function enterRoom(code,seat){
  S.ai=null;

}

/* ---------- Firebase backend for the standalone site: same shape as the claude.ai store ---------- */
function loadScript(src){return new Promise((ok,no)=>{const el=document.createElement('script');el.src=src;el.onload=ok;el.onerror=()=>no(new Error(TR('無法載入 ','Could not load ')+src));document.head.appendChild(el)})}
async function firebaseBackend(cfg){
  if(!window.firebase||!window.firebase.firestore){
    const b='https://www.gstatic.com/firebasejs/10.12.2/';
    await loadScript(b+'firebase-app-compat.js');
    await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-firestore-compat.js')]);
  }
  const fb=window.firebase;if(!fb.apps.length)fb.initializeApp(cfg);
  const auth=fb.auth();
  // reuse the anonymous account this browser already has, so a reload keeps the same seat
  let u=await new Promise(r=>{const un=auth.onAuthStateChanged(x=>{un();r(x)})});
  if(!u)u=(await auth.signInAnonymously()).user;
  const fs=fb.firestore(),uid=u.uid;
  const err=e=>({code:e&&e.code==='permission-denied'?'invalid_argument':'unavailable',message:String((e&&e.message)||e)});
  const wrap=x=>({id:x.id,exists:x.exists,data:()=>x.data(),metadata:{hasPendingWrites:x.metadata.hasPendingWrites,fromCache:x.metadata.fromCache}});
  // expireAt is the Timestamp field a Firestore TTL policy can watch
  const ttl=d=>d.exp?{...d,expireAt:new Date(d.exp)}:d;
  const query=q=>({where:(f,o,v)=>query(q.where(f,o,v)),limit:n=>query(q.limit(n)),get:()=>q.get().then(x=>({docs:x.docs.map(wrap),size:x.size,empty:x.empty}),e=>{throw err(e)})});
  const db={collection:path=>query(fs.collection(path)),doc:path=>{const r=fs.doc(path);return {path,
    get:()=>r.get().then(wrap,e=>{throw err(e)}),
    set:d=>r.set(ttl(d)).catch(e=>{throw err(e)}),
    update:d=>r.set(ttl(d),{merge:true}).catch(e=>{throw err(e)}), // deep-merges nested maps like the claude.ai store
    delete:()=>r.delete().catch(e=>{throw err(e)}),
    acquire:({holder,ttlMs=5000})=>fs.runTransaction(async tx=>{
      const x=await tx.get(r),l=x.exists&&x.data().lease;
      if(l&&l.exp>Date.now()&&l.holder!==holder)return {acquired:false};
      tx.set(r,{lease:{holder,exp:Date.now()+ttlMs}},{merge:true});return {acquired:true};
    }).catch(e=>{throw err(e)}),
    onSnapshot:(next,onErr)=>r.onSnapshot(x=>next(wrap(x)),e=>onErr&&onErr(err(e)))}}};
  return [db,{id:async()=>uid,can:async()=>true}];
}

    :`<section class="panel teamcard ${i?'B':''}" id="seat${i}"></section>`;
  $('#app').innerHTML=`${header()}
  <section class="panel"><div class="eyebrow">${TR('線上房間','Online room')}</div>
   <div class="row" style="justify-content:space-between;margin-top:4px"><h2>${TR('房號','Room code')} <span class="mono ta" style="font-size:44px;letter-spacing:.08em">${NET.code}</span></h2><button class="ghost" id="copy">${TR('複製房號','Copy code')}</button></div>
   <p class="hint">${TR('把這組房號傳給朋友。朋友打開同一個網頁，點「線上對戰」，輸入房號加入。','Send this code to your friend. They open the same page, choose "Online" and enter the code.')}${me==null?TR('這個房間已經滿了，你正在觀戰。',' This room is full; you are watching.'):''}</p></section>
  <div class="grid2">${seat(0)}${seat(1)}</div>
  <section class="panel">${me===0?`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><h2>${TR('規則設定','Settings')}</h2><p class="hint" style="margin-top:4px">${TR('由房主設定，對手會同步看到。','The host sets these; your opponent sees them live.')}</p><div class="row" style="margin-top:10px"><span class="eyebrow">${TR('賽制','Format')}</span>${modeSeg()}</div><div class="row" style="margin-top:8px"><span class="eyebrow">${TR('名額','Roster spots')}</span>${slotPickers()}</div></div>
     <div class="row" style="align-items:flex-end"><label style="width:150px">${TR('每隊預算（$）','Budget per team ($)')}<input id="bud" type="number" min="30" max="1000" value="${cfg.budget}"></label><label style="width:150px">${TR('總籤數','Total lots')}<input id="lots" type="number" min="${lotsNeeded()}" max="200" value="${cfg.lotMax}"></label></div></div>
     <div class="row" style="margin-top:14px"><button class="solid" id="go">${TR('開始選秀','Start draft')}</button><span class="hint" id="gowhy"></span></div>`
    :`<h2>${TR('規則設定','Settings')}</h2><p class="hint" style="margin-top:6px" id="cfgtxt"></p>`}</section>`;
  $('#copy').onclick=()=>{navigator.clipboard.writeText(NET.code).then(()=>{$('#copy').textContent=TR('已複製','Copied')},()=>{$('#copy').textContent=TR('房號：','Code: ')+NET.code})};
  if(me!=null){
    const save=()=>{clearTimeout(setupTimer);setupTimer=setTimeout(()=>dbWrite(()=>NET.ref.update({setup:{[me]:{name:$('#tn').value.trim(),park:me}}})),400)};
    $('#tn').oninput=save;
    $('#rn').onclick=()=>{const other=((NET.doc&&NET.doc.setup&&NET.doc.setup[1-me])||{}).name;let n;do{n=randomName()}while(n===other);$('#tn').value=n;save()};
  }
  if(me===0){
    const saveCfg=()=>dbWrite(()=>NET.ref.update({cfg:{budget:clamp(parseInt($('#bud').value)||200,30,1000),lotMax:clamp(parseInt($('#lots').value)||30,lotsNeeded(),200)}}));
    $('#bud').onchange=saveCfg;$('#lots').onchange=saveCfg;
    $('#go').onclick=startOnlineDraft;
    document.querySelectorAll('[data-slot]').forEach(el=>el.onchange=()=>{S.slots={...S.slots,[el.dataset.slot]:+el.value};
      NET.doc={...(NET.doc||{}),cfg:{...((NET.doc&&NET.doc.cfg)||{}),slots:S.slots}};
      dbWrite(()=>NET.ref.update({cfg:{slots:S.slots}}));renderRoom()});
    document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=b.dataset.m;S.mode=m;fixSlots();
      NET.doc={...(NET.doc||{}),cfg:{...((NET.doc&&NET.doc.cfg)||{}),mode:m}};
      dbWrite(()=>NET.ref.update({cfg:{mode:m}}));renderRoom()});
  }
  updateRoom();
}
function roomNames(){const su=(NET.doc&&NET.doc.setup)||{};return [0,1].map(i=>NET.seat===i&&$('#tn')?$('#tn').value.trim():((su[i]||{}).name||'').trim())}
function updateRoom(){
  if(S.screen!=='room'||!$('#app'))return;
  const d=NET.doc||{},seats=d.seats||{},su=d.setup||{},cfg=d.cfg||{budget:200,lotMax:30};
  if((cfg.mode||'single')!==S.mode){S.mode=cfg.mode||'single';return renderRoom()}
  if(cfg.slots&&JSON.stringify(cfg.slots)!==JSON.stringify(S.slots)){S.slots={...cfg.slots};return renderRoom()}
  [0,1].forEach(i=>{const el=$('#seat'+i);if(!el)return;const s=su[i]||{},joined=!!seats[i];
    el.innerHTML=`<div class="eyebrow ${i?'tb':'ta'}">${TR('玩家 ','Player ')}${i?'B':'A'}${NET.seat==null?'':TR('（對手）',' (opponent)')}</div>
     <h2 style="margin-top:6px"></h2><p class="hint" style="margin-top:6px"></p>`;
    el.querySelector('h2').textContent=joined?(s.name||TR('（還沒取隊名）','(no name yet)')):TR('等待朋友加入…','Waiting for your friend…');
    el.querySelector('p').textContent=joined?TR('已加入','Joined'):TR('把房號傳給朋友。','Send the code to your friend.')});
  const n=roomNames();
  const why=!seats[1]?TR('等待玩家 B 加入。','Waiting for Player B to join.'):(!n[0]||!n[1])?TR('兩隊都要先取好隊名。','Both teams need a name.'):n[0]===n[1]?TR('兩隊隊名不能相同。','The two teams need different names.'):'';
  if($('#go')){$('#go').disabled=!!why;$('#gowhy').textContent=why}
  if($('#cfgtxt'))$('#cfgtxt').textContent=`NBA · ${MODEZH[S.mode]} · ${TR(`替補 ${S.slots.BN} 人`,`${S.slots.BN} bench`)} · ${TR('每隊預算','Budget')} $${cfg.budget} · ${TR('總籤數','Lots')} ${cfg.lotMax}. ${why||TR('等待房主開始選秀。','Waiting for the host to start the draft.')}`;
}
function startOnlineDraft(){
  const su=(NET.doc&&NET.doc.setup)||{},n=roomNames();
  const parks=[0,1];
  const bud=clamp(parseInt($('#bud').value)||200,30,1000);
  S.budget=bud;S.lotMax=Math.max(clamp(parseInt($('#lots').value)||30,lotsNeeded(),200),lotsNeeded());
  S.teams=[0,1].map(i=>({name:n[i],park:parks[i],budget:bud,roster:[],done:false}));
  S.deck=POOL.slice();
  for(let i=S.deck.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[S.deck[i],S.deck[j]]=[S.deck[j],S.deck[i]]}
    newDeckOrder();
  S.lotNo=0;S.log=[];S.lot=null;S.trade=null;S.series=null;S.game=null;S.screen='draft';
  // the draw order goes out once; each bid afterwards only says which players are gone
  {const deck0={k:S.deckKey,ids:S.deck0};NET.doc={...(NET.doc||{}),deck0};dbWrite(()=>NET.ref.update({deck0}))}
  nextLot();sync();
}

function render(){
  document.title=TR('NBA 盲標對決','NBA Blind Auction');
  if($('#followbtn')){$('#follow span').textContent=TR('對手已經前往下一步。','Your opponent has moved on.');$('#followbtn').textContent=TR('跟上','Catch up')}
  updateNetBadge();
  $('#app').className='wrap s-'+S.screen;
  const f={home:renderHome,setup:renderSetup,draft:renderDraft,pregame:renderPregame,trade:renderTrade,pick:renderPick,game:startGame,room:renderRoom}[S.screen];
  if(f) return f();
  if(S.screen==='stuck'){ $('#app').innerHTML=`${header()}<section class="panel"><h2>${TR('球員池用完了','Out of players')}</h2><p class="hint">${TR('剩下的球員沒有人能填補還缺的位置。請重新選秀。','No remaining player can fill the missing spots. Start a new draft.')}</p><button id="restart">${TR('重新選秀','New draft')}</button></section>`; $('#restart').onclick=()=>{S.screen=NET.on?'room':'setup';sync();render()}; }
}
setLeague(S.league);
render();

</script>

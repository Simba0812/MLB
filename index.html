<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>大聯盟盲標對決</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Noto+Sans+TC:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a hand-operated outfield scoreboard — green panels, chalk numerals, two team colors. Single dark look by choice. */
:root{
  --board:#0d3326; --panel:#14463a; --panel2:#1b5546; --line:#2c6b5a;
  --chalk:#f1ede0; --dim:#a9c2b6; --amber:#f2b134; --sky:#7cc7ea; --red:#e0664f; --good:#7fd38a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--board);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.018) 0 2px,transparent 2px 46px)}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
/* draft screen: everything, bid box included, should fit one screen. render() tags .wrap with the screen
   (s-draft, s-pick, s-game) instead of :has(), which phones re-check on every update */
.wrap.s-draft{gap:10px}
.wrap.s-draft header.top{padding-bottom:6px}
.wrap.s-draft h1{font-size:clamp(26px,3vw,34px)}
.wrap.s-draft h1 small{font-size:13px;margin-top:2px}
.draft .panel{padding:12px 14px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--chalk);padding-bottom:10px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(34px,6vw,58px);line-height:.95;margin:0;letter-spacing:.01em;text-transform:uppercase}
h1 small{display:block;font-family:var(--body);font-size:15px;font-weight:500;color:var(--dim);letter-spacing:0;text-transform:none;margin-top:6px}
h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h3{margin:0;font-size:16px;font-weight:700}
.src{font-size:12px;color:var(--dim);text-align:right}
.hdr-r{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.src a{color:var(--dim)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
input,select{font:inherit;color:var(--chalk);background:var(--board);border:2px solid var(--line);border-radius:3px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--chalk);background:transparent;color:var(--chalk);padding:9px 16px;border-radius:3px}
button.solid{background:var(--chalk);color:var(--board)}
button.a{border-color:var(--amber);color:var(--amber)} button.a.solid{background:var(--amber);color:#1d1606}
button.b{border-color:var(--sky);color:var(--sky)} button.b.solid{background:var(--sky);color:#06202c}
button:disabled{opacity:.35;cursor:not-allowed}
button.ghost{border-color:var(--line);color:var(--dim);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ta{color:var(--amber)} .tb{color:var(--sky)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--dim);margin:0}

/* draft */
.draft{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.8fr) minmax(0,.8fr);gap:12px;align-items:start}
@media (max-width:960px){.draft{grid-template-columns:1fr}.draft .lotcol{order:-1}}
.teamcard{border-top:6px solid var(--amber)} .teamcard.B{border-top-color:var(--sky)}
.teamcard .money{font-family:var(--display);font-weight:900;font-size:clamp(30px,2.6vw,40px);line-height:1}
.slotpick{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--chalk)}
.slotpick select{padding:4px 8px}
.slots{display:grid;grid-template-columns:auto 1fr auto;gap:0 8px;font-size:12.5px;line-height:1.4;margin-top:8px}
.slots .k{font-family:var(--mono);color:var(--dim)} .slots .v{min-width:0;overflow-wrap:anywhere} .slots .p{font-family:var(--mono);color:var(--dim);text-align:right}
.slots .empty{color:#6f9686}
.need{font-size:12px;color:var(--dim);margin-top:8px}
.lot{position:relative;perspective:1200px}
.card{background:var(--chalk);color:#10261d;border-radius:6px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;transform-origin:50% 50%}
.card.flip{animation:flip .6s ease}
@keyframes flip{from{transform:rotateY(90deg);opacity:.2}to{transform:rotateY(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}}
.card .lotno{font-family:var(--mono);font-size:12px;color:#4d6a5d}
.card .name{font-family:var(--display);font-weight:900;font-size:clamp(26px,3vw,38px);line-height:.95;text-transform:uppercase}
.card .zh{font-size:17px;font-weight:900}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.pos{display:inline-block;background:#10261d;color:var(--chalk);font-family:var(--mono);font-weight:600;padding:2px 8px;border-radius:2px}
.ovr{margin-left:auto;font-family:var(--display);font-weight:900;font-size:34px;line-height:1;text-align:right}
.ovr span{display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.1em;color:#4d6a5d}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:4px}
.stat{border:1.5px solid #c9c2a8;border-radius:3px;padding:3px 6px;line-height:1.3}
.stat b{display:block;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.stat i{display:block;font-style:normal;font-size:10.5px;line-height:1.2;color:#4d6a5d;overflow-wrap:anywhere}
.stat.sv{border-color:#d0571f}
.stat.sv i{color:#a8441a}
.stat.wide{grid-column:span 2}
.stat em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;color:#4d6a5d}
.stat.t90{border:3px solid #c99a1e;background:#fbefc8}
.stat.t75{border:3px solid #c8372d}
.stat.t50{border:3px solid #2f8f4e}
.legend{display:inline-flex;gap:8px;flex-wrap:wrap;margin-left:8px;letter-spacing:0;text-transform:none;font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;border:3px solid}
.spopt{flex-direction:row;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--chalk);font-size:14px}
.spopt .spn{flex:1;min-width:8em;font-weight:700}
.spopt:has(input:disabled){opacity:.45;cursor:not-allowed}
.statlabel{font-size:10.5px;letter-spacing:.1em;margin-top:2px;font-weight:700;color:#4d6a5d;text-transform:uppercase}
.facedown{background:repeating-linear-gradient(45deg,#1b5546 0 12px,#174c3e 12px 24px);border:2px dashed var(--line);border-radius:6px;min-height:340px;display:grid;place-items:center;text-align:center;padding:20px}
.facedown .q{font-family:var(--display);font-size:120px;font-weight:900;line-height:1;color:var(--line)}
/* the bid box stays on screen even when a long card pushes it down */
.bidbox{display:flex;flex-direction:column;gap:8px;margin-top:8px;position:sticky;bottom:0;z-index:5;box-shadow:0 -6px 16px rgba(0,0,0,.35)}
.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price .big{font-family:var(--display);font-weight:900;font-size:40px;line-height:1}
.turn{font-weight:700}
.log{max-height:180px;overflow:auto;font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:2px}
.log div b{color:var(--chalk);font-weight:500}

/* game */
.linescore{overflow-x:auto}
.linescore table{border-collapse:collapse;font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:100%}
.linescore th,.linescore td{padding:6px 8px;text-align:center;border:1px solid var(--line);min-width:34px}
.linescore td.tn{text-align:left;font-family:var(--body);font-weight:700;white-space:nowrap}
.linescore th{color:var(--dim);font-weight:400;font-size:12px}
.linescore td.tot{font-weight:600;background:var(--panel2)}
.pbp{background:var(--board);border:2px solid var(--line);border-radius:4px;padding:14px;max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:15px}
.pbp .half{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.03em;margin-top:12px;padding-top:8px;border-top:1px solid var(--line)}
.pbp .half:first-child{margin-top:0;border-top:0}
.pbp .pa{padding-left:12px;border-left:3px solid transparent}
.pbp .pa.run{border-left-color:var(--good)}
.pbp .pa.hr{border-left-color:var(--red);font-weight:700}
.pbp .note{color:var(--dim);font-size:13px;padding-left:12px}
.pbp .sc{font-family:var(--mono);font-size:12px;color:var(--good);margin-left:6px}
.reveal{text-align:center;padding:28px 18px;border:3px solid var(--chalk);border-radius:4px;background:var(--panel2)}
.reveal .w{font-family:var(--display);font-weight:900;font-size:clamp(40px,8vw,84px);line-height:1;text-transform:uppercase}
.reveal.flash{animation:pop .7s ease}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.reveal.flash{animation:none}}
.box{overflow-x:auto}
.box table{border-collapse:collapse;width:100%;font-size:13px}
.box th,.box td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.box th:first-child,.box td:first-child{text-align:left;font-family:var(--body)}
.box th{color:var(--dim);font-weight:400}
.lineup{display:grid;grid-template-columns:auto auto 1fr auto;gap:2px 10px;font-size:14px}
.lineup .k{font-family:var(--mono);color:var(--dim)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;font-weight:500;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--chalk);color:var(--board);font-weight:700}
.panel.soon{border-style:dashed;opacity:.75}
.lobbybar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lobbybar #lobbyask{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:700}
.lobbybar #lobbyask[hidden]{display:none}
.lobbybar button{padding:6px 12px}
.netbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:6px 12px}
.netbar .dot{width:9px;height:9px;border-radius:50%;background:var(--good)}
.netbar .warn{color:var(--amber)}
.netbar .sync{color:var(--amber);font-family:var(--mono);font-size:12px}
.netbar .sync.ok{color:var(--dim)}
.follow{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;background:var(--panel2);border-top:3px solid var(--amber);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-weight:700}
.waiting{color:var(--dim);font-weight:500}
.sta{display:inline-block;width:64px;height:8px;border-radius:4px;background:var(--board);border:1px solid var(--line);overflow:hidden;vertical-align:middle}
.sta i{display:block;height:100%}
.stan{font-size:12px;color:var(--dim);min-width:3.2em}
.penlist{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;font-size:13px}
.lued{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.lurow{display:grid;grid-template-columns:2.4em 2.4em minmax(0,1fr) auto;gap:6px;align-items:center;border-radius:3px}
.lurow.picked{background:var(--panel2);outline:2px solid var(--amber)}
.lunum{padding:5px 0;border-color:var(--line);font-weight:700}
.lurow.picked .lunum{background:var(--amber);color:#1d1606;border-color:var(--amber)}
.lurow select{padding:5px 6px;font-size:13px}
.lupos{color:var(--amber)}
.warn{font-size:12px;color:var(--red);white-space:nowrap}
button.mini{padding:3px 8px;font-size:13px}
.gstat{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.gp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.decide{border-color:var(--amber)}
.optlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;text-align:left;border-color:var(--line);font-weight:700}
.opt:hover{border-color:var(--amber)}
.opt .hint{font-weight:400}
.sugg{font-size:11px;font-weight:700;background:var(--amber);color:#1d1606;padding:1px 6px;border-radius:2px}
.autolbl{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.series{font-family:var(--mono);color:var(--dim);font-size:13px}
/* ---------- same device, touch screen: roster | bid | card | bid | roster ---------- */
.draft.duo{grid-template-columns:minmax(0,.9fr) minmax(0,.8fr) minmax(0,1.6fr) minmax(0,.8fr) minmax(0,.9fr);gap:8px;align-items:start}
.draft.duo .lotcol{order:0}
.draft.duo .duoside{position:sticky;top:8px;align-self:start;margin-top:40px}
.draft.duo .duobid{position:static;box-shadow:none;margin-top:0;padding:10px;gap:6px}
.draft.duo .duobid .price .big{font-size:32px}
.draft.duo .duobid.active{border-color:var(--amber)}
.draft.duo .duobid.B.active{border-color:var(--sky)}
.draft.duo .duobid:not(.active){opacity:.7}
.draft.duo .duobid .bidrow{flex-wrap:wrap;gap:6px}
.draft.duo .duobid .bidrow input{width:100%!important}
.draft.duo .duobid .bidrow button{flex:1 1 40%;padding:8px 4px}
.draft.duo .duobid .hint{font-size:11.5px}
.draft.duo .teamcard{padding:8px 10px}
.draft.duo .teamcard h2{font-size:17px}
.draft.duo .teamcard .money{font-size:28px}
.draft.duo .slots{font-size:11px;gap:0 5px}
.draft.duo .card{padding:8px 10px}
.draft.duo .card .stats{grid-template-columns:repeat(auto-fill,minmax(62px,1fr))}
/* phone held sideways: little height, so the header shrinks and the bid area tightens */
@media (max-height:520px){
  body.duo{padding-block:6px 16px}
  .wrap.duo{gap:6px}
  .wrap.duo header.top{padding-bottom:2px;border-bottom-width:2px}
  .wrap.duo h1{font-size:18px}
  .wrap.duo h1 small,.wrap.duo .src{display:none}
  .wrap.duo .lobbybar button{padding:2px 8px;font-size:12px}
  .draft.duo .duoside{margin-top:0;top:4px}
  .draft.duo .duobid{padding:7px 8px;gap:3px}
  .draft.duo .duobid .price .big{font-size:24px}
  .draft.duo .duobid .bidrow+.hint{display:none}
  .draft.duo .duobid .bidrow{gap:4px}
  .draft.duo .duobid .bidrow input{padding:4px 6px}
  .draft.duo .duobid .bidrow button{padding:5px 4px;font-size:13px}
  .draft.duo .teamcard h2{font-size:15px}
  .draft.duo .teamcard .money{font-size:22px}
}
/* ---------- phones ---------- */
.mobonly{display:none}
@media (pointer:coarse){input,select{font-size:16px}}   /* iOS zooms into smaller inputs */
@media (max-width:700px){
  body{padding-block:10px 24px}
  .wrap{gap:12px}
  header.top{gap:6px 10px;align-items:center;padding-bottom:6px}
  h1{font-size:24px}
  h1 small{font-size:11.5px;margin-top:3px}
  .src{font-size:10.5px}
  .wrap.s-draft .src,.wrap.s-game .src,.wrap.s-battle .src,.wrap.s-pick .src{display:none}
  .lobbybar button{padding:4px 10px;font-size:13px}
  .panel{padding:12px}
  .mobonly{display:block}
  .budgets{font-size:13px;font-weight:700}
  .card{padding:10px 12px}
  .stats{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
  .stat b{font-size:13px}
  .stat i{font-size:10px}
  .bidbox{padding:10px 12px;gap:6px}
  .bidbox .row{flex-wrap:nowrap;gap:5px}
  .bidbox input{width:58px!important;padding:6px;min-width:0}
  .bidbox button{padding:7px 8px;font-size:14px}
  .price{gap:6px}
  .price .big{font-size:30px}
  .turn{font-size:14px}
  .bidbox .hint{font-size:11.5px}
  .linescore th,.linescore td{padding:4px 2px;min-width:19px;font-size:12px}
  .linescore td.tn{max-width:62px;overflow:hidden;text-overflow:ellipsis}
  .box{padding:10px 8px}
  .box th,.box td{padding:4px 2px;font-size:11px;letter-spacing:-.02em}
  .box th:first-child,.box td:first-child{max-width:84px;overflow:hidden;text-overflow:ellipsis}
  .opt{padding:8px 10px}
  .reveal{padding:18px 12px}
}
</style>
</head>

/* ---------- ratings ---------- */
function hitBlend(p){ if(p.woba&&p.xwoba) return .5*p.woba+.5*p.xwoba; if(p.woba) return p.woba; return (parseFloat(p.obp)*1.8+parseFloat(p.slg))/3.1; }
function pitBlend(p){ const e=parseFloat(p.era); return p.xera!=null? .5*e+.5*p.xera : p.fip!=null? .5*e+.5*p.fip : e; }
// hitter rating ≈ 70% bat, 20% glove and position, 10% legs
const POSADJ={C:5,SS:4,CF:3,'2B':2,'3B':2,LF:0,RF:0,'1B':-3,DH:-5};
// fielding value on one scale for both leagues: OAA runs (MLB) or UZR (CPBL); catchers use framing runs
function computeDef(pool){
  const H=pool.filter(p=>p.type==='H'),raw=p=>p.pos==='C'?p.frm:(p.frp!=null?p.frp:p.uzr);
  const scale=g=>{const v=g.map(raw).filter(x=>x!=null),m=v.reduce((a,b)=>a+b,0)/(v.length||1),sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)**2,0)/(v.length||1))||1;
    return x=>x==null?0:clamp((x-m)/sd*6,-15,18)};
  const fc=scale(H.filter(p=>p.pos==='C')),ff=scale(H.filter(p=>p.pos!=='C'&&p.pos!=='DH'));
  H.forEach(p=>{p.def=p.pos==='DH'?0:Math.round((p.pos==='C'?fc:ff)(raw(p))*10)/10;
    // fielding at his other positions, from that position's own numbers. A short stint is pulled toward average
    // (60 games of average fielding mixed in), then scaled up to as many games as he played at his main position.
    p.defAt={};const gref=(p.poss&&p.poss[p.pos])||120;
    for(const [k,v] of Object.entries(p.pdef||{})){const g=(p.poss&&p.poss[k])||0;
      p.defAt[k]=Math.round((k==='C'?fc:ff)(v*gref/(g+60))*10)/10}});
}
// the rating is a player's rank among his own kind in this league (hitters, starters, relievers),
// read off a curve: top 3% about 93, top 10% about 86, top 20% about 80, median 68
const rawBat=p=>(hitBlend(p)-.28)*430+(p.def||0)+(POSADJ[p.pos]||0)+((p.spd||27)-27)*3;
const OVR_CURVE=[[0,45],[20,58],[50,68],[80,80],[90,86],[97,93],[100,99]];
let OVR_SORT={H:[],SP:[],RP:[]};
function buildOvr(){
  const H=POOL.filter(p=>p.type==='H'),P=POOL.filter(p=>p.type==='P'),asc=a=>a.sort((x,y)=>x-y);
  OVR_SORT={H:asc(H.map(rawBat)),SP:asc([...P.filter(p=>p.pos==='SP'),...H.filter(h=>h.twp).map(h=>h.twp)].map(pitOvr)),RP:asc(P.filter(p=>p.pos!=='SP').map(pitOvr))};
}
function rankPct(a,v){let lo=0,hi=a.length;while(lo<hi){const m=(lo+hi)>>1;if(a[m]<v)lo=m+1;else hi=m}return a.length>1?Math.min(100,lo/(a.length-1)*100):50}
function curveOvr(pr){for(let i=1;i<OVR_CURVE.length;i++){const [x1,y1]=OVR_CURVE[i-1],[x2,y2]=OVR_CURVE[i];if(pr<=x2)return y1+(y2-y1)*(pr-x1)/(x2-x1)}return 99}
function ovr(p){
  if(p.type==='H'){let o=curveOvr(rankPct(OVR_SORT.H,rawBat(p)));if(p.twp)o=Math.max(o,curveOvr(rankPct(OVR_SORT.SP,pitOvr(p.twp))))+4;return Math.round(clamp(o,40,99))}
  return Math.round(clamp(curveOvr(rankPct(p.pos==='SP'?OVR_SORT.SP:OVR_SORT.RP,pitOvr(p))),40,99));
}
function pitOvr(p){ return 96-(pitBlend(p)-2.2)*13+(p.r.k-.22)*70; }

let LG;
const computeLG=()=>{const keys=['k','bb','s1','s2','s3','hr'];const o={};let w=0;keys.forEach(k=>o[k]=0);
  POOL.filter(p=>p.type==='H').forEach(p=>{w+=p.pa;keys.forEach(k=>o[k]+=p.r[k]*p.pa)});keys.forEach(k=>o[k]/=w);return o};
// pitchers are judged against the pitcher pool's own average, so pool selection and stat
// definitions (CPBL pitcher walks exclude HBP) don't leak into every matchup
let LGP;
const computeLGP=()=>{const keys=['k','bb','s1','s2','s3','hr'];const o={};let w=0;keys.forEach(k=>o[k]=0);
  POOL.filter(p=>p.type==='P').forEach(p=>{const bf=(p.bfg||4)*(p.g||1);w+=bf;keys.forEach(k=>o[k]+=p.r[k]*bf)});keys.forEach(k=>o[k]/=w);return o};

/* ---------- Savant percentile ranks (vs. this player pool) ---------- */
const num=v=>v==null||v===''||v==='-.--'?null:+v;
const TGET={avg:p=>num(p.avg),obp:p=>num(p.obp),slg:p=>num(p.slg),ops:p=>num(p.ops),hr:p=>p.hr,rbi:p=>p.rbi,sb:p=>p.sb,kr:p=>p.r.k,bbr:p=>p.r.bb,
  era:p=>num(p.era),ip:p=>num(p.ip),w:p=>p.w,so:p=>p.so,whip:p=>num(p.whip)};
let PRS;
function buildPRS(){
PRS=(()=>{const H=POOL.filter(p=>p.type==='H'),P=[...POOL.filter(p=>p.type==='P'),...H.filter(h=>h.twp).map(h=>h.twp)];
  const mk=(a,k)=>a.map(p=>p[k]).filter(v=>v!=null).sort((x,y)=>x-y);
  return {H:{xwoba:mk(H,'xwoba'),xba:mk(H,'xba'),xslg:mk(H,'xslg'),brl:mk(H,'brl'),ev:mk(H,'ev'),spd:mk(H,'spd'),
             woba:mk(H,'woba'),wrc:mk(H,'wrc'),opsp:mk(H,'opsp'),iso:mk(H,'iso'),whiff:mk(H,'whiff')},
          P:{xera:mk(P,'xera'),xwoba:mk(P,'xwoba'),woba:mk(P,'woba'),fip:mk(P,'fip'),erap:mk(P,'erap'),opsp:mk(P,'opsp'),whiff:mk(P,'whiff'),velo:mk(P,'velo')}}})();
{const mk=(a,k)=>a.map(p=>p[k]).filter(v=>v!=null).sort((x,y)=>x-y);
PRS.H.oaa=mk(POOL.filter(p=>p.type==='H'&&p.pos!=='C'),'oaa');PRS.H.frp=mk(POOL.filter(p=>p.type==='H'&&p.pos!=='C'),'frp');
PRS.H.uzr=mk(POOL.filter(p=>p.type==='H'&&p.pos!=='C'),'uzr');PRS.H.frm=mk(POOL.filter(p=>p.type==='H'&&p.pos==='C'),'frm');}
(()=>{const H=POOL.filter(p=>p.type==='H'),P=[...POOL.filter(p=>p.type==='P'),...H.filter(h=>h.twp).map(h=>h.twp)];
  const mk=(a,k)=>a.map(TGET[k]).filter(v=>v!=null&&!isNaN(v)).sort((x,y)=>x-y);
  ['avg','obp','slg','ops','hr','rbi','sb','kr'].forEach(k=>PRS.H['t_'+k]=mk(H,k));
  PRS.SP={};PRS.RP={};
  ['era','ip','w','so','whip','kr','bbr'].forEach(k=>{PRS.SP['t_'+k]=mk(P.filter(p=>p.pos==='SP'),k);PRS.RP['t_'+k]=mk(P.filter(p=>p.pos!=='SP'),k)});})();
}

const FIELDPOS=['C','1B','2B','3B','SS','LF','CF','RF'];
const ALT_MIN={MLB:30,CPBL:150};
const playedAt=(p,k)=>p.pinn?p.pinn[k]||0:(p.poss&&p.poss[k])||0;
function setAlt(pool,lg){pool.forEach(p=>{p.alt=p.type==='H'&&!p.twp?FIELDPOS.filter(k=>k!==p.pos&&playedAt(p,k)>=ALT_MIN[lg]).sort((a,b)=>playedAt(p,b)-playedAt(p,a)):[]})}

const T=(g,k,p,low)=>prOf(g,'t_'+k,TGET[k](p),low);
function prOf(g,k,v,lowGood){const a=PRS[g][k];if(v==null||!a||!a.length)return null;
  let lt=0,le=0;for(const x of a){if(x<v)lt++;if(x<=v)le++}
  const r=(lt+le)/2/a.length*100;return clamp(Math.round(lowGood?100-r:r),0,100)}

// best-of-7 needs a fourth starter for the rotation
// starters, relievers and closers: the exact number set before the draft
const SLOT_KEYS=['SP','RP','CL','BN'];
const slotMin=sl=>SLOT_KEYS.includes(sl.k)?(S.slots[sl.k]??0):sl.min;
const slotMax=sl=>SLOT_KEYS.includes(sl.k)?(S.slots[sl.k]??0):sl.max;
// how many of each a team may take: half the league's pool, within 3-6 / 2-8 / 1-3; best-of-7 needs 4 starters
function slotRange(k){
  if(k==='BN') return [0,3];   // bench bats come from any position
  const pool=POOL.filter(p=>p.pos===k).length,cap=Math.floor(pool/2);
  const [lo,hi]={SP:[S.mode==='bo7'?4:3,6],RP:[2,8],CL:[1,3]}[k];
  return [Math.min(lo,cap),Math.max(Math.min(lo,cap),Math.min(hi,cap))];
}
function fixSlots(){SLOT_KEYS.forEach(k=>{const [lo,hi]=slotRange(k);S.slots[k]=clamp(S.slots[k]??lo,lo,hi)})}
const slotPickers=dis=>SLOT_KEYS.map(k=>{const [lo,hi]=slotRange(k);
  return `<label class="slotpick">${{SP:TR('先發','Starters'),RP:TR('中繼','Relievers'),CL:TR('終結者','Closers'),BN:TR('板凳','Bench')}[k]}<select data-slot="${k}" ${dis?'disabled':''}>${Array.from({length:hi-lo+1},(_,j)=>lo+j).map(n=>`<option value="${n}" ${S.slots[k]===n?'selected':''}>${n}</option>`).join('')}</select></label>`}).join('');
// enough lots that both teams can fill every required spot with room to spare
const lotsNeeded=()=>2*SLOTS.reduce((a,sl)=>a+slotMin(sl),0)+8;
function slotCount(t,k){return t.roster.filter(r=>r.slot===k||(r.slot2===k)).length}
function minRemaining(t){return SLOTS.reduce((s,sl)=>s+Math.max(0,slotMin(sl)-slotCount(t,sl.k)),0)}
function openSlotsFor(t,p,ignoreDone){
  if(t.done&&!ignoreDone) return [];
  const ks = p.twp? ['DH','SP','BN'] : p.type==='H'? [...new Set([p.pos,...(p.alt||[]),'DH','BN'])] : [p.pos];   // own position first, then the others he played, then DH, then bench
  return ks.filter(k=>slotCount(t,k)<slotMax(SLOTS.find(s=>s.k===k)));
}
function needsCovered(t,p,slots){ // how many required slots this player fills
  return slots.filter(k=>slotCount(t,k)<slotMin(SLOTS.find(s=>s.k===k))).length;
}
function maxBid(t,p){
  const slots=openSlotsFor(t,p); if(!slots.length) return 0;
  const after=minRemaining(t)-needsCovered(t,p,slots);
  return Math.max(0,t.budget-after);
}
function canMeetMin(t){return SLOTS.every(sl=>slotCount(t,sl.k)>=slotMin(sl))}
// which slot a newly added player takes: his own position first, the bench if it's full; a two-way player also fills a rotation spot
function placeSlot(p,slots){
  if(!p.twp) return {slot:slots[0]};
  const main=slots.includes('DH')?'DH':slots.includes('BN')?'BN':'SP';
  return {slot:main,slot2:main!=='SP'&&slots.includes('SP')?'SP':undefined};
}

/* ---------- computer opponent (single-player) ---------- */
const AI_LV={
  easy:{get label(){return TR('簡單','Easy')},get hint(){return TR('出價保守、判斷粗略，交易時稍微吃虧也會接受。','Bids cautiously, judges loosely, and accepts trades that cost it a little.')},scale:.8,noise:.4,accept:-3},
  normal:{get label(){return TR('普通','Normal')},get hint(){return TR('照球員價值出價，交易只接受不吃虧的。','Bids what players are worth and only accepts fair trades.')},scale:1,noise:.2,accept:0},
  hard:{get label(){return TR('困難','Hard')},get hint(){return TR('敢搶球星、判斷精準，交易要占便宜才接受。','Goes after stars, judges sharply, and only accepts trades it wins.')},scale:1.12,noise:.08,accept:2}};
let aiTimer=null;
function scheduleAI(){clearTimeout(aiTimer);if(S.ai&&S.screen==='draft'&&S.lot&&S.lot.turn===S.ai.seat)aiTimer=setTimeout(aiAct,S.aiFast?0:300+Math.random()*300)}
// what the computer is willing to pay for this player right now
function aiValue(t,p){
  const lv=AI_LV[S.ai.level],slots=openSlotsFor(t,p);if(!slots.length)return 0;
  const need=needsCovered(t,p,slots)>0,q=clamp((ovr(p)-50)/49,0,1),req=minRemaining(t);
  let v=1+S.budget*.24*q*q;                                   // a 99 is worth about a quarter of the starting budget
  v=Math.min(v,(t.budget/Math.max(1,req))*(need?3:1.2));     // keep enough money for the spots still empty
  if(!need)v*=.45;                                           // depth beyond the minimum roster matters less
  if(need&&S.lotMax-S.lotNo<req*2)v*=1.4;                     // few lots left: pay up for a spot it must fill
  const pace=t.budget/Math.max(1,S.budget*Math.max(0,S.lotMax-S.lotNo)/S.lotMax);
  if(pace>1.2)v*=Math.min(2.2,pace*.8);                        // more money left than the remaining lots need: spend it
  v*=lv.scale*(1+(Math.random()*2-1)*lv.noise);
  return Math.max(need?1:0,Math.floor(v));
}
function aiAct(){
  const L=S.lot;if(!S.ai||S.screen!=='draft'||!L||L.turn!==S.ai.seat)return;
  const t=S.teams[S.ai.seat],mb=maxBid(t,L.p);
  if(L.aiv==null)L.aiv=aiValue(t,L.p);                       // decided once per player, so it doesn't waver mid-auction
  const cap=Math.min(L.aiv,mb);
  if(mustBid())return bid(L.price+1);
  if(L.price+1>cap)return pass();
  const room=cap-L.price;
  bid(L.price+(L.price===0&&room>6?Math.max(1,Math.round(cap*.4)):Math.min(room,room>10?3:1)));
}
function aiTradeReply(){
  const T=S.trade,q=T&&T.pending;if(!S.ai||S.screen!=='trade'||!q||q.pi===S.ai.seat)return;
  const ai=S.ai.seat,A=S.teams[q.pi],B=S.teams[ai],get=A.roster[q.a].p,give=B.roster[q.b].p;
  const r=tradeResult(q.pi,q.a,ai,q.b),gain=ovr(get)-ovr(give);
  if(r&&gain>=AI_LV[S.ai.level].accept){A.roster=r[0];B.roster=r[1];T.log.unshift(TR(`✅ 電腦接受：${esc(A.name)} 的 ${esc(nm(get))} ⇄ ${esc(B.name)} 的 ${esc(nm(give))}`,`✅ Computer accepts: ${esc(A.name)}'s ${esc(nm(get))} ⇄ ${esc(B.name)}'s ${esc(nm(give))}`))}
  else T.log.unshift(TR(`❌ 電腦拒絕了 ${esc(nm(get))} ⇄ ${esc(nm(give))}，覺得不划算`,`❌ Computer turns down ${esc(nm(get))} ⇄ ${esc(nm(give))}: not worth it`));
  T.pending=null;T.sel=[null,null];render();
}
function aiPickSP(i){
  const g=S.series.games.length,tm=buildTeam(i),rest=recentStarters(i,g),sta=staminaMap(i,g);
  const rested=tm.sps.filter(p=>!rest.includes(sid(p.id))),fresh=rested.filter(p=>(sta[sid(p.id)]??100)>=60);
  const avail=fresh.length?fresh:rested.length?rested:tm.sps;   // the rest rule wins over stamina
  return (S.ai.level==='easy'?pick(avail):avail[0]).id;      // starters are already sorted best first
}

/* ---------- draft ---------- */
function nextLot(){
  if(S.teams.every(t=>t.done||SLOTS.every(sl=>slotCount(t,sl.k)>=slotMax(sl)))) return endDraft();
  const over=S.lotNo>=S.lotMax;
  if(over&&S.teams.every(canMeetMin)) return endDraft();
  const needAll=S.teams.reduce((s,t)=>s+minRemaining(t),0);
  const tight=over||(S.lotMax-S.lotNo)<=needAll+2;
  let idx=S.deck.findIndex(p=>S.teams.some(t=>{const sl=openSlotsFor(t,p);return sl.length&&maxBid(t,p)>=1&&(!tight||needsCovered(t,p,sl)>0)}));
  if(idx<0){ if(S.teams.every(canMeetMin)) return endDraft(); S.screen='stuck'; return render(); }
  const p=S.deck.splice(idx,1)[0];S.tail=(S.tail||[]).filter(id=>sid(id)!==sid(p.id));
  S.lotNo++;
  const first=(S.lotNo-1)%2;
  S.lot={p,price:0,high:null,turn:first,passed:[false,false],fresh:true};
  advanceAuto();
  render();
}
function eligible(i){const t=S.teams[i],L=S.lot;return openSlotsFor(t,L.p).length>0&&maxBid(t,L.p)>L.price}
function advanceAuto(){ // skip players who cannot act
  const L=S.lot;
  for(let guard=0;guard<4;guard++){
    if(L.high!=null && L.turn===L.high) return award(); // other side passed
    if(!eligible(L.turn)){ L.passed[L.turn]=true; if(L.high!=null) return award(); if(L.passed[1-L.turn]) return unsold(); L.turn=1-L.turn; continue;}
    return;
  }
}
function bid(amount){
  const L=S.lot,i=L.turn,t=S.teams[i];
  if(!(amount>L.price&&amount<=maxBid(t,L.p))) return;
  L.price=amount;L.high=i;L.turn=1-i;L.fresh=false;
  S.log.unshift(`<b class="${i?'tb':'ta'}">${esc(t.name)}</b> ${TR('出價','bids')} $${amount}`);
  advanceAuto();render();
}
function mustBid(){const L=S.lot,t=S.teams[L.turn];if(!L||L.high!=null||S.lotNo<=S.lotMax)return false;const sl=openSlotsFor(t,L.p);return needsCovered(t,L.p,sl)>0}
function pass(){
  if(mustBid()) return;
  const L=S.lot,i=L.turn;L.passed[i]=true;L.fresh=false;
  S.log.unshift(`<b class="${i?'tb':'ta'}">${esc(S.teams[i].name)}</b> ${TR('放棄加價','passes')}`);
  if(L.high!=null) return award();
  if(L.passed[1-i]) return unsold();
  L.turn=1-i;advanceAuto();render();
}
function award(){
  const L=S.lot,t=S.teams[L.high],slots=openSlotsFor(t,L.p,true);
  t.budget-=L.price;
  const entry={p:L.p,price:L.price,...placeSlot(L.p,slots)};
  t.roster.push(entry);
  S.log.unshift(TR(`⚾ <b>${esc(nm(L.p))}</b> 由 <b class="${L.high?'tb':'ta'}">${esc(t.name)}</b> 以 $${L.price} 得標${L.p.twp?`（二刀流：${slots.map(k=>POSZH[k]).join('＋')}）`:''}`,
    `⚾ <b>${esc(nm(L.p))}</b> goes to <b class="${L.high?'tb':'ta'}">${esc(t.name)}</b> for $${L.price}${L.p.twp?` (two-way: ${slots.map(k=>POSZH[k]).join(' + ')})`:''}`));
  S.lot=null;nextLot();
}
function unsold(){
  const p=S.lot.p;S.log.unshift(TR(`${esc(nm(p))} 流標`,`${esc(nm(p))} goes unsold`));
  // a player some team still needs goes back into the draw, so thin positions (CPBL closers) can still be filled
  if(S.teams.some(t=>{const sl=openSlotsFor(t,p,true);return needsCovered(t,p,sl)>0})){S.deck.push(p);(S.tail=S.tail||[]).push(p.id)}
  S.lot=null;nextLot()}
function declareDone(i){S.teams[i].done=true;S.log.unshift(`<b class="${i?'tb':'ta'}">${esc(S.teams[i].name)}</b> ${TR('宣布陣容完成','declares the roster done')}`);
  if(S.lot){ if(S.lot.high===i){/* keep their bid */} advanceAuto(); if(S.lot) render(); } }

function statBox(v,l,sv,pr,cls){const t=pr==null?'':pr>=90?'t90':pr>=75?'t75':pr>=50?'t50':'';return `<div class="stat ${sv?'sv':''} ${t} ${cls||''}" title="${esc(l)}${pr!=null?' · PR '+pr:''}"><b>${v}</b><i>${l}</i>${pr!=null?`<em>PR ${pr}</em>`:''}</div>`}

   ${statBox(f3(p.woba),'wOBA',1,prOf('H','woba',p.woba))}${statBox(rf(p.wrc),'wRC+',1,prOf('H','wrc',p.wrc))}${statBox(rf(p.opsp),'OPS+',1,prOf('H','opsp',p.opsp))}${statBox(f3(p.iso),'ISO',1,prOf('H','iso',p.iso))}${statBox(p.whiff!=null?pct(p.whiff):'—',TR('揮空率','Whiff%'),1,prOf('H','whiff',p.whiff,1))}${statBox(p.gbp!=null?pct(p.gbp):'—',TR('滾地球率','GB%'),1)}</div>`}
function rebasPit(p){return `<div class="statlabel">${TR('野球革命 進階數據','Rebas advanced')}${LEGEND}</div><div class="stats">${statBox('—',TR('直球均速：中職未公開','Fastball velo: not public in CPBL'),1,null,'wide')}
   ${statBox(rf(p.fip,2),'FIP',1,prOf('P','fip',p.fip,1))}${statBox(rf(p.erap),'ERA+',1,prOf('P','erap',p.erap))}${statBox(rf(p.opsp),TR('被 OPS+','opp OPS+'),1,prOf('P','opsp',p.opsp,1))}${statBox(p.whiff!=null?pct(p.whiff):'—',TR('揮空率','Whiff%'),1,prOf('P','whiff',p.whiff))}${statBox(p.gbp!=null?pct(p.gbp):'—',TR('滾地球率','GB%'),1)}</div>`}
function defBlock(p){
  const box=p.pos==='DH'?statBox('—',TR('指定打擊不守備','DH: no fielding'),1)
    :p.pos==='C'?statBox(rf(p.frm,1),TR('捕手框球（分）','Framing (runs)'),1,prOf('H','frm',p.frm))
    :S.league==='CPBL'?statBox(rf(p.uzr,1),'UZR',1,prOf('H','uzr',p.uzr))
    :statBox(p.oaa!=null?(p.oaa>0?'+':'')+p.oaa:'—','OAA',1,prOf('H','oaa',p.oaa))+statBox(rf(p.frp),TR('守備跑分','Fielding runs'),1,prOf('H','frp',p.frp));
  return `<div class="statlabel">${TR('守備','Defense')}（${S.league==='CPBL'?TR('野球革命','Rebas'):'Baseball Savant'}）${LEGEND}</div><div class="stats">${box}${statBox((p.def>0?'+':'')+(p.def||0).toFixed(1),TR('守備指數','Defense index'),1)}</div>`;
}
const veloTxt=v=>v?`${v.toFixed(1)}<small> mph</small>`:'—';
function hitterStats(p){return hitterStatsBase(p)+defBlock(p)}

   ${statBox(p.avg,TR('打擊率','AVG'),0,T('H','avg',p))}${statBox(p.obp,TR('上壘率','OBP'),0,T('H','obp',p))}${statBox(p.slg,TR('長打率','SLG'),0,T('H','slg',p))}${statBox(p.ops,'OPS',0,T('H','ops',p))}${statBox(p.hr,TR('全壘打','HR'),0,T('H','hr',p))}${statBox(p.rbi,TR('打點','RBI'),0,T('H','rbi',p))}${statBox(p.sb,TR('盜壘','SB'),0,T('H','sb',p))}${statBox(pct(p.r.k),TR('三振率','K%'),0,T('H','kr',p,1))}${statBox(p.pa,TR('打席','PA'))}</div>
   ${S.league==='CPBL'?rebasHit(p):`<div class="statlabel">Baseball Savant${LEGEND}</div><div class="stats">
   ${statBox(f3(p.xwoba),'xwOBA',1,prOf('H','xwoba',p.xwoba))}${statBox(f3(p.xba),'xBA',1,prOf('H','xba',p.xba))}${statBox(f3(p.xslg),'xSLG',1,prOf('H','xslg',p.xslg))}${statBox(p.brl!=null?p.brl+'%':'—','Barrel%',1,prOf('H','brl',p.brl))}${statBox(p.ev!=null?p.ev:'—',TR('初速 mph','EV mph'),1,prOf('H','ev',p.ev))}${statBox(p.spd!=null?p.spd:'—',TR('衝刺 ft/s','Sprint (ft/s)'),1,prOf('H','spd',p.spd))}</div>`}`;

function pitcherStats(p,title){

   ${statBox(p.era,TR('防禦率','ERA'),0,T(g,'era',p,1))}${statBox(p.ip,TR('局數','IP'),0,T(g,'ip',p))}${statBox(p.w+'-'+p.l,TR('勝-敗','W-L'),0,T(g,'w',p))}${statBox(p.pos==='SP'?p.gs:p.sv+'/'+p.hld,p.pos==='SP'?TR('先發','GS'):TR('救援/中繼','SV/HLD'))}${statBox(p.so,TR('三振','SO'),0,T(g,'so',p))}${statBox(p.whip,'WHIP',0,T(g,'whip',p,1))}${statBox(pct(p.r.k),'K%',0,T(g,'kr',p))}${statBox(pct(p.r.bb),'BB%',0,T(g,'bbr',p,1))}</div>

function teamPanel(i){
  const t=S.teams[i];
  const rows=SLOTS.map(sl=>{
    const got=t.roster.filter(r=>r.slot===sl.k||r.slot2===sl.k);
    const lines=[];
    for(let n=0;n<slotMax(sl);n++){
      const r=got[n];
      if(r) lines.push(`<span class="k">${sl.k}</span><span class="v">${esc(nm(r.p))}${r.p.type==='H'&&FIELDPOS.includes(sl.k)&&r.p.pos!==sl.k?` <small class="mono">(${r.p.pos})</small>`:''}</span><span class="p">${r.slot2===sl.k?TR('二刀流','two-way'):'$'+r.price}</span>`);
      else if(n<slotMin(sl)) lines.push(`<span class="k">${sl.k}</span><span class="v empty">${TR('（必填）','(required)')}</span><span class="p"></span>`);
    }
    return lines.join('');
  }).join('');
  const mr=minRemaining(t);
  return `<section class="panel teamcard ${i?'B':''}">
   <div class="eyebrow ${i?'tb':'ta'}">${S.ai?(S.ai.seat===i?TR('電腦','Computer'):TR('你','You')):TR('玩家 ','Player ')+(i?'B':'A')}${NET.on&&NET.seat===i?TR('（你）',' (you)'):''} · ${esc(PARKS[t.park].n)}</div>
   <h2 style="margin-top:4px">${esc(t.name)}</h2>
   <div class="row" style="justify-content:space-between;margin-top:6px"><div class="money ${i?'tb':'ta'}">$${t.budget}</div>
   <div class="need">${TR(`還差 ${mr} 個必要位置`,`${mr} required spot${mr===1?'':'s'} left`)}${t.done?`<br><b>${TR('已宣布完成','Roster done')}</b>`:''}</div></div>
   <div class="slots">${rows}</div>
   ${canMeetMin(t)&&!t.done&&isMine(i)?`<button class="ghost" style="margin-top:12px;width:100%" data-done="${i}">${TR('陣容完成，不再競標','Roster done, stop bidding')}</button>`:''}
  </section>`;
}

    if(duo){
      side=[0,1].map(j=>{const tj=S.teams[j],my=j===i;

          <div class="eyebrow ${j?'tb':'ta'}">${esc(tj.name)}</div>

        </div>`});

     <div class="panel bidbox">

      <div class="turn">${TR('輪到 ','To bid: ')}<span class="${i?'tb':'ta'}">${esc(t.name)}</span>${TR(`（最高可出 $${mb}）`,` (max $${mb})`)}</div>
      ${!isMine(i)?`<p class="waiting">${TR(`等待 ${esc(t.name)} 出價或放棄…`,`Waiting for ${esc(t.name)} to bid or pass…`)}</p>`:bidControls(L,i)}

    :`<div class="draft">${teamPanel(0)}<div class="lotcol">${lotHtml}</div>${teamPanel(1)}</div>`;
  $('#app').innerHTML=`${header()}
   ${grid}
   <section class="panel"><div class="eyebrow">${TR('競標紀錄','Auction log')}</div><div class="log" style="margin-top:8px">${S.log.map(l=>`<div>${l}</div>`).join('')||`<div>${TR('第一位球員即將揭曉。','The first player is about to be revealed.')}</div>`}</div></section>`;
  if(L&&$('#bidbtn')){
    const go=()=>{bid(parseInt($('#bidv').value));sync()};

}
function endDraft(){S.lot=null;S.screen='trade';S.trade={left:[3,3],prop:0,sel:[null,null],pending:null,log:[]};render()}

/* ---------- trades ---------- */
function tradeResult(pi,ai,oi,bi){
  const A=S.teams[pi],B=S.teams[oi],xa=A.roster[ai],yb=B.roster[bi];
  const ta={roster:A.roster.filter(e=>e!==xa)},tb={roster:B.roster.filter(e=>e!==yb)};
  const put=(t,e)=>{const sl=openSlotsFor(t,e.p,true);if(!sl.length)return false;
    t.roster.push({p:e.p,price:e.price,...placeSlot(e.p,sl),traded:true});return true};
  if(!put(ta,yb)||!put(tb,xa)) return null;
  if(!canMeetMin(ta)||!canMeetMin(tb)) return null;
  return [ta.roster,tb.roster];
}

  else status=`${esc(nm(P.roster[T.sel[pi]].p))} ⇄ ${esc(nm(O.roster[T.sel[oi]].p))}${TR('，位置符合規定。',': positions check out.')}`;

    `<b class="${T.pending.pi?'tb':'ta'}">${esc(S.teams[T.pending.pi].name)}</b> offers <b>${esc(nm(S.teams[T.pending.pi].roster[T.pending.a].p))}</b> for <b class="${T.pending.pi?'ta':'tb'}">${esc(S.teams[1-T.pending.pi].name)}</b>'s <b>${esc(nm(S.teams[1-T.pending.pi].roster[T.pending.b].p))}</b>.`)}</p>
     <p class="hint">${TR(`請 ${esc(S.teams[1-T.pending.pi].name)} 決定是否接受。`,`${esc(S.teams[1-T.pending.pi].name)}, accept or decline?`)}</p>

/* ---------- lineup building ---------- */
const POSLIST=['C','1B','2B','3B','SS','LF','CF','RF','DH'];
function asPitcher(entry){const p=entry.p;return p.twp?{...p.twp,id:p.id,n:p.n,zh:p.zh,t:p.t,type:'P',pos:'SP'}:p}
const sid=x=>String(x);
function teamHitters(i){return S.teams[i].roster.filter(r=>r.p.type==='H'&&r.slot!=='SP')}
// batting order: best OBP leads off, best two bats hit 2-3, power 4th, then the rest by quality
function defaultLineup(i){
  const st=teamHitters(i).filter(r=>POSLIST.includes(r.slot)).map(r=>({p:r.p,pos:r.slot}));
  const q=[...st].sort((a,b)=>hitBlend(b.p)-hitBlend(a.p));
  const lead=[...q.slice(0,5)].sort((a,b)=>parseFloat(b.p.obp)-parseFloat(a.p.obp))[0];
  const rest=q.filter(x=>x!==lead);
  return [lead,...rest].filter(Boolean).map(x=>({id:x.p.id,pos:x.pos}));
}
function validLineup(i,lu){
  if(!Array.isArray(lu)||lu.length!==9) return false;
  const ids=new Set(teamHitters(i).map(r=>sid(r.p.id)));
  return lu.every(x=>ids.has(sid(x.id)))&&new Set(lu.map(x=>sid(x.id))).size===9&&POSLIST.every(k=>lu.some(x=>x.pos===k));
}
const lineupFor=(i,lu)=>validLineup(i,lu)?lu:defaultLineup(i);
// fielding value at a position. Main position: his own rating. Secondary position: his rating from that position's own
// numbers; if the source had none, 70% of a good main-position rating (a poor one stays poor), or -2 where catcher is involved,
// since framing and range don't carry over. Anywhere else: a big penalty.
function defOf(p,pos){
  if(pos==='DH') return 0;
  if(p.pos===pos) return p.def||0;
  if(p.alt&&p.alt.includes(pos)){if(p.defAt&&p.defAt[pos]!=null)return p.defAt[pos];
    if(pos==='C'||p.pos==='C'||p.pos==='DH')return -2;const d=p.def||0;return d>0?d*.7:d}
  return pos==='C'?-12:Math.min(p.def||0,0)-5;
}
function buildTeam(i,lu){
  const t=S.teams[i],line=lineupFor(i,lu),byId=new Map(teamHitters(i).map(r=>[sid(r.p.id),r.p]));
  const order=line.map(x=>({...byId.get(sid(x.id)),fpos:x.pos}));
  const inLine=new Set(line.map(x=>sid(x.id)));
  const bench=teamHitters(i).filter(r=>!inLine.has(sid(r.p.id))).map(r=>r.p);
  const sps=t.roster.filter(r=>r.slot==='SP'||r.slot2==='SP').map(asPitcher).sort((a,b)=>pitBlend(a)-pitBlend(b));
  const rps=t.roster.filter(r=>r.slot==='RP').map(r=>r.p).sort((a,b)=>pitBlend(a)-pitBlend(b));
  const cl=t.roster.filter(r=>r.slot==='CL').map(r=>r.p);
  return {i,name:t.name,park:PARKS[t.park],order,bench,sps,rps,cl};
}

const capOf=p=>p.pos==='SP'?Math.max(75,(p.np||85)*1.3):Math.max(22,(p.np||16)*1.8);
// strength at the start of game g, from pitches thrown in the previous three games
function staminaMap(i,g){
  const m={};
  for(let k=1;k<=3&&g-k>=0;k++){
    const use=gameResult(g-k).use||{},w=[1,.5,.2][k-1];
    for(const id in use) m[id]=(m[id]||0)+use[id]*w;
  }
  const out={};for(const id in m) out[id]=clamp(Math.round(100-1.5*m[id]),5,100);

}

const TACT0={off:'bal',run:'norm',pit:'norm'};
const tacOK=t=>t&&TACT.off[t.off]&&TACT.run[t.run]&&TACT.pit[t.pit];

const tacOf=v=>{const [off,run,pit]=String(v||'').split('|'),t={off,run,pit};return tacOK(t)?t:{...TACT0}};
const tm_=(t,side,k)=>(TACT[side][t[side]]||{})[k];
const tf=(t,side,k)=>tm_(t,side,k)??1;   // a multiplier, 1 when the tactic doesn't touch it
const ta=(t,side,k)=>tm_(t,side,k)??0;   // an addition, 0 when it doesn't
// the computer: chase runs when behind late, protect a lead with contact and strikes; otherwise stay as it is
function aiTactic(inning,lead,cur){
  if(inning>=7&&lead<=-3)return {off:'power',run:'norm',pit:'norm'};

function tacticsPicker(t,prefix,i){

/* ---------- simulation engine ---------- */
function adjH(h){const m=(h.woba&&h.xwoba)?(.5*h.woba+.5*h.xwoba)/h.woba:1;const r={...h.r};['s1','s2','s3','hr'].forEach(k=>r[k]*=m);return r}
function adjP(p){const m=p.m!=null?p.m:(p.woba&&p.xwoba)?(.5*p.woba+.5*p.xwoba)/p.woba:1;const r={...p.r};['s1','s2','s3','hr'].forEach(k=>r[k]*=m);return r}
function log5(b,p,l){const x=b*p/l, y=(1-b)*(1-p)/(1-l);return x/(x+y)}
function paProbs(h,p,park,fat,cdef,to,tp){
  const hr=adjH(h),pr=adjP(p),o={};
  ['k','bb','s1','s2','s3','hr'].forEach(k=>o[k]=log5(clamp(hr[k],.001,.6),clamp(pr[k],.001,.6),LGP[k])*(to?tf(to,'off',k):1)*(tp?tf(tp,'pit',k):1));
  o.hr*=park.hr/100*fat; o.s1*=Math.sqrt(park.r/100)*fat; o.s2*=park.r/100*fat; o.s3*=park.r/100; o.bb*=fat; o.k/=fat;
  o.k*=1+cdef*.004; o.bb*=1-cdef*.006;            // catcher framing steals or gives away strikes
  let s=o.k+o.bb+o.s1+o.s2+o.s3+o.hr; if(s>.8){Object.keys(o).forEach(k=>o[k]*=.8/s);s=.8}
  o.out=1-s; return o;
}
const IFW=[['3B',.25],['SS',.3],['2B',.28],['1B',.17]],OFW=[['LF',.33],['CF',.37],['RF',.3]];
const wpick=ws=>{let x=rnd();for(const [k,w] of ws){if(x<w)return k;x-=w}return ws[ws.length-1][0]};
const DIRZH=biMap({LF:'左外野',CF:'中外野',RF:'右外野'},{LF:'left field',CF:'center field',RF:'right field'});
function curSta(c){return clamp(c.sta0-c.pc/c.E*100,0,100)}
function autoWantsChange(c,inning,lead,mid){
  const sta=curSta(c);
  if(c.starter){
    if(mid) return sta<12||c.runs>=6||(c.runs>=5&&sta<45);
    return sta<22||c.runs>=5||(inning>=7&&sta<40);
  }
  if(mid) return sta<10||c.runs>=3;
  return c.outs>=3||sta<35;
}
// ctx.dec: decisions already made in this game, in order; ctx.human[team]: does a person manage that team
function simGame(away,home,ctx){
  const park=home.park, ev=[], line=[[],[]], R=[0,0], H=[0,0], E=[0,0];
  const box=[away,home].map(tm=>({bat:tm.order.map(h=>({h,ab:0,r:0,hits:0,d2:0,d3:0,hr:0,rbi:0,bb:0,k:0})),pit:[]}));
  let di=0;
  const st=[away,home].map((tm,ti)=>{
    const sta0=p=>tm.sta0&&tm.sta0[sid(p.id)]!=null?tm.sta0[sid(p.id)]:100;
    const sp=tm.chosenSP||tm.sps[0];
    const s={tm,ti,sta0,pen:[...tm.rps,...tm.cl,...tm.sps.filter(x=>x!==sp)],used:new Set([sp]),bench:[...tm.bench],
      lu:box[ti].bat.slice(),bi:0,field:{},tac:tacOK(tm.tac)?{...tm.tac}:{...TACT0}};
    tm.order.forEach(h=>{if(h.fpos!=='DH')s.field[h.fpos]=h});
    s.cur={p:sp,pc:0,bf:0,outs:0,runs:0,starter:true,sta0:sta0(sp),E:capOf(sp)};
    box[ti].pit.push({p:sp,outs:0,h:0,r:0,bb:0,k:0,hr:0,pc:0});
    return s;
  });
  const say=(t,c)=>ev.push({k:'pa',t,c});
  let wp={W:null,L:null,S:null}, leadInfo={team:null,pitcherW:null,pitcherL:null};
  const pbox=ti=>box[ti].pit[box[ti].pit.length-1];
  const defAt=(ti,pos)=>st[ti].field[pos]?defOf(st[ti].field[pos],pos):0;
  const fielder=(ti,pos)=>`${POSZH[pos]} ${nm(st[ti].field[pos]||{n:''})}`;
  const pstat=s=>[nm(s.cur.p),s.cur.pc,Math.round(curSta(s.cur))];
  const avail=s=>s.pen.filter(p=>!s.used.has(p));
  const baseTxt=b=>{const on=TR(['一','二','三'],['1st','2nd','3rd']).filter((_,j)=>b[j]);return on.length?TR(on.join('、')+'壘有人','runner'+(on.length>1?'s':'')+' on '+on.join(' & ')):TR('壘上無人','bases empty')};

  function decide(info){
    if(di<ctx.dec.length) return ctx.dec[di++];
    throw {pause:{...info,di,score:[...R]},partial:{away,home,park,ev:ev.slice(),line,R:[...R],H:[...H],E:[...E]}};
  }
  function pickReliever(s,inning,lead){
    const pen=avail(s);if(!pen.length)return null;
    const sta=p=>s.sta0(p);
    const save=inning>=9&&lead>=1&&lead<=3, tieLate=inning>=9&&lead===0&&s.ti===1;
    const cl=pen.find(p=>p.pos==='CL'&&sta(p)>=40);
    if(cl&&(save||tieLate)) return cl;
    // starters stay in the rotation: they relieve only when the bullpen is spent
    const bull=pen.filter(p=>p.pos!=='SP'&&sta(p)>=30);
    const pool=(bull.length?bull:pen).filter(p=>p.pos!=='CL'||inning>=9);
    const fresh=pool.filter(p=>sta(p)>=45);
    const cand=(fresh.length?fresh:pool.length?pool:pen).slice().sort((a,b)=>(pitBlend(a)-sta(a)/40)-(pitBlend(b)-sta(b)/40));
    // close and late: best arm; otherwise keep the best arms for later
    return inning>=7&&Math.abs(lead)<=3?cand[0]:cand[cand.length>2?Math.floor(cand.length/2):0];
  }
  function doChange(dt,np,lead){
    const s=st[dt],old=s.cur.p;
    s.used.add(np);
    s.cur={p:np,pc:0,bf:0,outs:0,runs:0,starter:false,enterLead:lead,sta0:s.sta0(np),E:capOf(np)};
    box[dt].pit.push({p:np,outs:0,h:0,r:0,bb:0,k:0,hr:0,pc:0});
    ev.push({k:'note',t:TR(`🔄 ${s.tm.name} 換投：${nm(old)} 退場，由${POSZH[np.pos]||'投手'} ${nm(np)} 上場（體力 ${s.sta0(np)}%）。`,`🔄 ${s.tm.name} pitching change: ${nm(old)} is done; ${POSZH[np.pos]||'pitcher'} ${nm(np)} comes in (stamina ${s.sta0(np)}%).`)});
  }
  function managePitcher(dt,inning,lead,mid,bases,outs,half){
    const s=st[dt],c=s.cur,sta=curSta(c);
    if(!avail(s).length) return;
    const want=autoWantsChange(c,inning,lead,mid);
    const closer=!mid&&inning>=9&&lead>=1&&lead<=3&&c.p.pos!=='CL'&&avail(s).some(p=>p.pos==='CL'&&s.sta0(p)>=40);
    const sug=want||closer?pickReliever(s,inning,lead):null;
    let choice=sug?sid(sug.id):'keep';
    const kept=c.keep&&c.keep.runs===c.runs&&c.keep.sta-sta<15;
    // blowouts are managed automatically; ask when the game is within reach or the starter is in trouble
    const ask=(Math.abs(lead)<=4||c.starter)&&(mid?want&&!kept:(want||closer||sta<40));
    if(ctx.human[s.tm.i]&&ask){
      choice=decide({kind:'pitch',team:s.tm.i,inning,half,outs,bases:baseTxt(bases),lead,suggest:choice,
        cur:{id:sid(c.p.id),name:nm(c.p),pc:c.pc,sta:Math.round(sta),runs:c.runs,era:c.p.era},
        opts:avail(s).map(p=>({id:sid(p.id),name:nm(p),pos:p.pos,era:p.era,sta:s.sta0(p),velo:p.velo}))});
      if(choice==='keep') c.keep={runs:c.runs,sta};

  function manageTactics(inning){
    for(const s of st){
      const lead=R[s.ti]-R[1-s.ti],sug=tacStr(aiTactic(inning,lead,s.tac));
      let v=sug;
      if(ctx.human[s.tm.i])v=decide({kind:'tac',team:s.tm.i,inning,half:0,outs:0,bases:baseTxt([null,null,null]),lead,suggest:sug,cur:tacStr(s.tac)});
      const t=tacOf(v);
      if(tacStr(t)!==tacStr(s.tac)){s.tac=t;ev.push({k:'note',t:TR(`📋 ${s.tm.name} 調整戰術：打擊「${TACTL().off[t.off]}」、跑壘「${TACTL().run[t.run]}」、投球「${TACTL().pit[t.pit]}」。`,`📋 ${s.tm.name} change tactics: batting "${TACTL().off[t.off]}", running "${TACTL().run[t.run]}", pitching "${TACTL().pit[t.pit]}".`)})}
    }
  }
  function managePH(bt,inning,diff,bases,outs,half){
    const s=st[bt],slot=s.bi,row=s.lu[slot],h=row.h,bench=s.bench;
    if(!bench.length||inning<6||Math.abs(diff)>3||!(bases[1]||bases[2])) return;
    const best=bench.slice().sort((a,b)=>hitBlend(b)-hitBlend(a))[0];
    let choice=inning>=7&&Math.abs(diff)<=2&&hitBlend(best)>hitBlend(h)+.03?sid(best.id):'keep';
    if(ctx.human[s.tm.i]){

      choice=decide({kind:'ph',team:s.tm.i,inning,half,outs,bases:baseTxt(bases),lead:diff,suggest:choice,
        cur:{id:sid(h.id),name:nm(h),pos:h.fpos,avg:h.avg,ops:h.ops,ovr:ovr(h),today:TR(`${row.ab} 打數 ${row.hits} 安打`,`${row.hits}-for-${row.ab}`)},
        opts:bench.map(p=>({id:sid(p.id),name:nm(p),pos:p.pos,avg:p.avg,ops:p.ops,ovr:ovr(p)}))});
    }
    if(choice==='keep') return;
    const ph=bench.find(p=>sid(p.id)===choice);if(!ph) return;
    s.bench=bench.filter(p=>p!==ph);
    const nh={...ph,fpos:h.fpos},nr={h:nh,ab:0,r:0,hits:0,hr:0,rbi:0,bb:0,k:0,ph:true};
    box[bt].bat.splice(box[bt].bat.indexOf(row)+1,0,nr);s.lu[slot]=nr;
    if(h.fpos!=='DH') s.field[h.fpos]=nh;
    ev.push({k:'note',t:TR(`🔁 ${s.tm.name} 代打：${nm(ph)} 代替 ${nm(h)} 上場打擊${h.fpos!=='DH'&&ph.pos!==h.fpos?`，之後守${POSZH[h.fpos]}（非本守位）`:''}。`,`🔁 ${s.tm.name} pinch-hitter: ${nm(ph)} bats for ${nm(h)}${h.fpos!=='DH'&&ph.pos!==h.fpos?` and stays in as ${POSZH[h.fpos]} (out of position)`:''}.`)});
  }

  let inning=1, done=false, last=null;
  while(!done){
    if(inning===4||inning===7)manageTactics(inning);
    for(let half=0;half<2;half++){
      const bt=half, dt=1-half;

function seriesStats(n){

    [r.away,r.home].forEach((tm,bi)=>{const b=r.box[bi],t=T[tm.i];
      b.bat.forEach(x=>{const k=sid(x.h.id),a=t.bat.get(k)||{p:x.h,g:0,ab:0,r:0,h:0,d2:0,d3:0,hr:0,rbi:0,bb:0,k:0};
        a.g++;a.h+=x.hits;['ab','r','d2','d3','hr','rbi','bb','k'].forEach(f=>a[f]+=x[f]||0);t.bat.set(k,a)});
      b.pit.forEach(x=>{const k=sid(x.p.id),a=t.pit.get(k)||{p:x.p,g:0,outs:0,h:0,r:0,bb:0,k:0,hr:0};
        a.g++;['outs','h','r','bb','k','hr'].forEach(f=>a[f]+=x[f]);t.pit.set(k,a)});});}

}

function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
async function createRoom(){
  let code;for(let k=0;k<6;k++){code=genCode();const s=await NET.db.doc('rooms/'+code).get();if(!s.exists)break}
  await roomDoc(code).set({v:1,seats:{0:NET.uid},setup:{0:{name:'',park:0},1:{name:'',park:1}},cfg:{budget:200,lotMax:50,league:S.league,mode:S.mode,slots:S.slots},picks:{},state:'',rev:'',created:Date.now()});
  enterRoom(code,0);
}
async function joinRoom(raw){
  const code=String(raw||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(code)) throw new Error(TR('房號是 4 個英文字母或數字。','Room codes are 4 letters or digits.'));
  const ref=roomDoc(code),s=await ref.get();
  if(!s.exists||roomExpired(s.data())) throw new Error(TR('找不到這個房號，請確認後再試一次。','No room with that code. Check it and try again.'));
  // the NBA page uses the same rooms; its rooms say so in cfg.game
  if((s.data().cfg||{}).game==='nba') throw new Error(TR('這是 NBA 版的房號，請到 NBA 版的網頁加入。','That code belongs to the NBA game; join it there.'));
  const seats=s.data().seats||{};
  if(seats[0]===NET.uid) return enterRoom(code,0);
  if(seats[1]===NET.uid) return enterRoom(code,1);
  if(!seats[1]){
    const lease=await ref.acquire({holder:NET.uid,ttlMs:5000});
    if(lease.acquired){const d2=(await ref.get()).data();if(!d2.seats||!d2.seats[1]){await ref.update({seats:{1:NET.uid}});return enterRoom(code,1)}}
  }
  enterRoom(code,null);
}
function enterRoom(code,seat){
  S.ai=null;
  Object.assign(NET,{on:true,code,seat,ref:roomDoc(code),err:'',pending:null,doc:null,drawn:false});
  try{localStorage.setItem('mlbRoom',code)}catch(e){}
  S.rev=null;S.screen='room';render();
  if(NET.unsub)NET.unsub();
  NET.unsub=NET.ref.onSnapshot(onRoom,()=>{NET.err=TR('連線中斷，請重新整理頁面。','Connection lost. Reload the page.');updateNetBadge()});
}
(async()=>{
  try{
    if(window.OFFLINE){NET.status='off';return}
    const C=window.claude,FC=window.FIREBASE_CONFIG;
    const [db,user]=FC&&FC.apiKey?await firebaseBackend(FC):C&&C.use?await Promise.all([C.use('db'),C.use('user')]):[null,null];
    if(!db||!user){NET.status='off';NET.msg=window.STANDALONE?TR('線上對戰還沒設定 Firebase。請照 README 的步驟把設定填進 firebase-config.js。','Online play needs Firebase. Follow the README to fill in firebase-config.js.'):TR('這個檢視模式沒辦法連線。請在 claude.ai 登入後，從分享給你的連結打開這個頁面。','Online play isn\'t available in this view. Sign in to claude.ai and open the page from the link shared with you.')}
    else{
      const uid=await user.id(),cw=await user.can('data.write');
      if(!uid){NET.status='off';NET.msg=TR('請先登入 claude.ai 再使用線上對戰。','Sign in to claude.ai to play online.')}
      else if(cw===false){NET.status='off';NET.msg=TR('你目前只有檢視權限，沒辦法加入對戰。請房主從頁面的 Share 選單把你設為可以編輯（Editor）。','You only have view access. Ask the host to make you an Editor from the page\'s Share menu.')}
      else{Object.assign(NET,{status:'ready',db,user,uid});sweepRooms()}
    }
  }catch(e){NET.status='off';NET.msg=window.STANDALONE?TR(`Firebase 連線失敗，請確認設定正確、匿名登入已啟用。（${(e&&(e.code||e.message))||''}）`,`Couldn't connect to Firebase. Check the config and that anonymous sign-in is enabled. (${(e&&(e.code||e.message))||''})`):TR('線上功能暫時無法使用，請重新整理頁面。','Online play is unavailable right now. Reload the page.')}
  renderNetBox();
})();

/* ---------- Firebase backend for the standalone site: same shape as the claude.ai store ---------- */
function loadScript(src){return new Promise((ok,no)=>{const el=document.createElement('script');el.src=src;el.onload=ok;el.onerror=()=>no(new Error(TR('無法載入 ','Could not load ')+src));document.head.appendChild(el)})}
async function firebaseBackend(cfg){
  if(!window.firebase||!window.firebase.firestore){
    const b='https://www.gstatic.com/firebasejs/10.12.2/';
    await loadScript(b+'firebase-app-compat.js');
    await Promise.all([loadScript(b+'firebase-auth-compat.js'),loadScript(b+'firebase-firestore-compat.js')]);
  }
  const fb=window.firebase;if(!fb.apps.length)fb.initializeApp(cfg);
  const auth=fb.auth();
  // reuse the anonymous account this browser already has, so a reload keeps the same seat
  let u=await new Promise(r=>{const un=auth.onAuthStateChanged(x=>{un();r(x)})});
  if(!u)u=(await auth.signInAnonymously()).user;
  const fs=fb.firestore(),uid=u.uid;
  const err=e=>({code:e&&e.code==='permission-denied'?'invalid_argument':'unavailable',message:String((e&&e.message)||e)});
  const wrap=x=>({id:x.id,exists:x.exists,data:()=>x.data(),metadata:{hasPendingWrites:x.metadata.hasPendingWrites,fromCache:x.metadata.fromCache}});
  // expireAt is the Timestamp field a Firestore TTL policy can watch
  const ttl=d=>d.exp?{...d,expireAt:new Date(d.exp)}:d;
  const query=q=>({where:(f,o,v)=>query(q.where(f,o,v)),limit:n=>query(q.limit(n)),get:()=>q.get().then(x=>({docs:x.docs.map(wrap),size:x.size,empty:x.empty}),e=>{throw err(e)})});
  const db={collection:path=>query(fs.collection(path)),doc:path=>{const r=fs.doc(path);return {path,
    get:()=>r.get().then(wrap,e=>{throw err(e)}),
    set:d=>r.set(ttl(d)).catch(e=>{throw err(e)}),
    update:d=>r.set(ttl(d),{merge:true}).catch(e=>{throw err(e)}), // deep-merges nested maps like the claude.ai store
    delete:()=>r.delete().catch(e=>{throw err(e)}),
    acquire:({holder,ttlMs=5000})=>fs.runTransaction(async tx=>{
      const x=await tx.get(r),l=x.exists&&x.data().lease;
      if(l&&l.exp>Date.now()&&l.holder!==holder)return {acquired:false};
      tx.set(r,{lease:{holder,exp:Date.now()+ttlMs}},{merge:true});return {acquired:true};
    }).catch(e=>{throw err(e)}),
    onSnapshot:(next,onErr)=>r.onSnapshot(x=>next(wrap(x)),e=>onErr&&onErr(err(e)))}}};
  return [db,{id:async()=>uid,can:async()=>true}];
}

/* ---------- home + room screens ---------- */

  <div class="grid2">
   <section class="panel"><h2>${TR('單人對戰','Single player')}</h2><p class="hint" style="margin-top:6px">${TR('你和電腦競標、交易，再模擬對戰。電腦會依球員評價、缺的位置和剩下的預算出價。','Bid and trade against the computer, then play the games. The computer bids by rating, the positions it needs and the budget it has left.')}</p><button class="solid" id="solo" style="margin-top:14px">${TR('開始','Start')}</button></section>
   <section class="panel"><h2>${TR('同一台輪流玩','Same device')}</h2><p class="hint" style="margin-top:6px">${TR('兩個人用同一台電腦或手機，輪流出價、輪流選先發。','Two people share one computer or phone and take turns.')}</p><button class="solid" id="local" style="margin-top:14px">${TR('開始','Start')}</button></section>

  renderNetBox();

function renderNetBox(){
  const box=$('#netbox');if(!box)return;
  if(NET.status==='loading'){box.innerHTML=`<p class="hint">${TR('正在確認線上功能…','Checking online play…')}</p>`;return}
  if(NET.status!=='ready'){box.innerHTML=`<p class="hint">${esc(NET.msg)}</p>`;return}
  let last='';try{last=localStorage.getItem('mlbRoom')||''}catch(e){}
  box.innerHTML=`<div class="row"><button class="solid" id="mk">${TR('建立房間','Create room')}</button></div>
   <div class="row" style="margin-top:12px"><input id="code" maxlength="4" placeholder="${TR('房號','Code')}" autocomplete="off" style="width:110px;text-transform:uppercase;font-family:var(--mono)" aria-label="${TR('房號','Room code')}"><button id="join">${TR('加入房間','Join room')}</button>
   ${/^[A-Z0-9]{4}$/.test(last)?`<button class="ghost" id="rejoin">${TR('回到','Back to')} ${esc(last)}</button>`:''}</div>
   <p class="hint" id="neterr" role="alert" style="margin-top:8px"></p>`;
  const busy=async(btn,fn)=>{btn.disabled=true;$('#neterr').textContent='';try{await fn()}catch(e){$('#neterr').textContent=e&&e.message&&!e.code?e.message:TR('連線失敗，請再試一次。','Connection failed. Try again.');btn.disabled=false}};
  $('#mk').onclick=()=>busy($('#mk'),createRoom);
  $('#join').onclick=()=>busy($('#join'),()=>joinRoom($('#code').value));
  $('#code').onkeydown=e=>{if(e.key==='Enter')$('#join').click()};
  if($('#rejoin'))$('#rejoin').onclick=()=>busy($('#rejoin'),()=>joinRoom(last));
}
let setupTimer=null;
function renderRoom(){
  const d=NET.doc||{},su=d.setup||{},cfg=d.cfg||{budget:200,lotMax:50},me=NET.seat;
  NET.drawn=!!NET.doc;
  const mine=me!=null?(su[me]||{name:'',park:me}):null;
  const opts=sel=>PARKS.map((p,j)=>`<option value="${j}" ${sel===j?'selected':''}>${esc(p.n)}</option>`).join('');
  const seat=i=>me===i?`<section class="panel teamcard ${i?'B':''}"><div class="eyebrow ${i?'tb':'ta'}">${TR('玩家 ','Player ')}${i?'B':'A'}${TR('（你）',' (you)')}</div>
     <div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">
      <label for="tn">${TR('隊名','Team name')}</label><div class="row" style="flex-wrap:nowrap;margin-top:-8px"><input id="tn" maxlength="18" style="flex:1" placeholder="${TR('例：高雄海神','e.g. Kaohsiung Sea Kings')}" value="${esc(mine.name)}"><button type="button" class="ghost" id="rn">🎲 ${TR('隨機取名','Random name')}</button></div>
      <label>${TR('主場','Home park')}<select id="pk">${opts(Math.min(mine.park??i,PARKS.length-1))}</select></label><p class="hint" id="pkf"></p></div></section>`
    :`<section class="panel teamcard ${i?'B':''}" id="seat${i}"></section>`;
  $('#app').innerHTML=`${header()}
  <section class="panel"><div class="eyebrow">${TR('線上房間','Online room')}</div>
   <div class="row" style="justify-content:space-between;margin-top:4px"><h2>${TR('房號','Room code')} <span class="mono ta" style="font-size:44px;letter-spacing:.08em">${NET.code}</span></h2><button class="ghost" id="copy">${TR('複製房號','Copy code')}</button></div>
   <p class="hint">${TR('把這組房號傳給朋友。朋友打開同一個網頁，點「線上對戰」，輸入房號加入。','Send this code to your friend. They open the same page, choose "Online" and enter the code.')}${me==null?TR('這個房間已經滿了，你正在觀戰。',' This room is full; you are watching.'):''}</p></section>
  <div class="grid2">${seat(0)}${seat(1)}</div>
  <section class="panel">${me===0?`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><h2>${TR('規則設定','Settings')}</h2><p class="hint" style="margin-top:4px">${TR('由房主設定，對手會同步看到。','The host sets these; your opponent sees them live.')}</p><div class="row" style="margin-top:10px"><span class="eyebrow">${TR('聯盟','League')}</span>${leagueSeg()}</div><div class="row" style="margin-top:8px"><span class="eyebrow">${TR('賽制','Format')}</span>${modeSeg()}</div><div class="row" style="margin-top:8px"><span class="eyebrow">${TR('名額','Roster spots')}</span>${slotPickers()}</div></div>
     <div class="row" style="align-items:flex-end"><label style="width:150px">${TR('每隊預算（$）','Budget per team ($)')}<input id="bud" type="number" min="30" max="1000" value="${cfg.budget}"></label><label style="width:150px">${TR('總籤數','Total lots')}<input id="lots" type="number" min="34" max="200" value="${cfg.lotMax}"></label></div></div>
     <div class="row" style="margin-top:14px"><button class="solid" id="go">${TR('開始選秀','Start draft')}</button><span class="hint" id="gowhy"></span></div>`
    :`<h2>${TR('規則設定','Settings')}</h2><p class="hint" style="margin-top:6px" id="cfgtxt"></p>`}</section>`;
  $('#copy').onclick=()=>{navigator.clipboard.writeText(NET.code).then(()=>{$('#copy').textContent=TR('已複製','Copied')},()=>{$('#copy').textContent=TR('房號：','Code: ')+NET.code})};
  if(me!=null){
    const pf=()=>{const p=PARKS[+$('#pk').value];$('#pkf').textContent=TR(`球場係數：得分 ${p.r}、全壘打 ${p.hr}（100 為聯盟平均）`,`Park factors: runs ${p.r}, home runs ${p.hr} (100 = league average)`)};pf();
    const save=()=>{clearTimeout(setupTimer);setupTimer=setTimeout(()=>dbWrite(()=>NET.ref.update({setup:{[me]:{name:$('#tn').value.trim(),park:+$('#pk').value}}})),400)};
    $('#tn').oninput=save;$('#pk').onchange=()=>{pf();save()};
    $('#rn').onclick=()=>{const other=((NET.doc&&NET.doc.setup&&NET.doc.setup[1-me])||{}).name;let n;do{n=randomName()}while(n===other);$('#tn').value=n;save()};
  }
  if(me===0){
    const saveCfg=()=>dbWrite(()=>NET.ref.update({cfg:{budget:clamp(parseInt($('#bud').value)||200,30,1000),lotMax:clamp(parseInt($('#lots').value)||50,34,200)}}));
    $('#bud').onchange=saveCfg;$('#lots').onchange=saveCfg;
    $('#go').onclick=startOnlineDraft;
    document.querySelectorAll('[data-slot]').forEach(el=>el.onchange=()=>{S.slots={...S.slots,[el.dataset.slot]:+el.value};
      NET.doc={...(NET.doc||{}),cfg:{...((NET.doc&&NET.doc.cfg)||{}),slots:S.slots}};
      dbWrite(()=>NET.ref.update({cfg:{slots:S.slots}}));renderRoom()});
    document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=b.dataset.m;S.mode=m;fixSlots();
      NET.doc={...(NET.doc||{}),cfg:{...((NET.doc&&NET.doc.cfg)||{}),mode:m}};
      dbWrite(()=>NET.ref.update({cfg:{mode:m}}));renderRoom()});
    document.querySelectorAll('[data-lg]').forEach(b=>b.onclick=()=>{
      setLeague(b.dataset.lg);const lg=S.league;
      // update the local copy too, or the re-render below would read the old league back from it
      NET.doc={...(NET.doc||{}),cfg:{...((NET.doc&&NET.doc.cfg)||{}),league:lg}};
      dbWrite(()=>NET.ref.update({cfg:{league:lg}}));renderRoom()});
  }
  updateRoom();
}
function roomNames(){const su=(NET.doc&&NET.doc.setup)||{};return [0,1].map(i=>NET.seat===i&&$('#tn')?$('#tn').value.trim():((su[i]||{}).name||'').trim())}
function updateRoom(){
  if(S.screen!=='room'||!$('#app'))return;
  const d=NET.doc||{},seats=d.seats||{},su=d.setup||{},cfg=d.cfg||{budget:200,lotMax:50};
  const want=POOLS[cfg.league]&&POOLS[cfg.league].length?cfg.league:'MLB';
  if(want!==S.league){setLeague(want);return renderRoom()}
  if((cfg.mode||'single')!==S.mode){S.mode=cfg.mode||'single';return renderRoom()}
  if(cfg.slots&&JSON.stringify(cfg.slots)!==JSON.stringify(S.slots)){S.slots={...cfg.slots};return renderRoom()}
  [0,1].forEach(i=>{const el=$('#seat'+i);if(!el)return;const s=su[i]||{},joined=!!seats[i];
    el.innerHTML=`<div class="eyebrow ${i?'tb':'ta'}">${TR('玩家 ','Player ')}${i?'B':'A'}${NET.seat==null?'':TR('（對手）',' (opponent)')}</div>
     <h2 style="margin-top:6px"></h2><p class="hint" style="margin-top:6px"></p>`;
    el.querySelector('h2').textContent=joined?(s.name||TR('（還沒取隊名）','(no name yet)')):TR('等待朋友加入…','Waiting for your friend…');
    el.querySelector('p').textContent=joined?TR('主場：','Home park: ')+PARKS[Math.min(s.park??i,PARKS.length-1)].n:TR('把房號傳給朋友。','Send the code to your friend.')});
  const n=roomNames();
  const why=!seats[1]?TR('等待玩家 B 加入。','Waiting for Player B to join.'):(!n[0]||!n[1])?TR('兩隊都要先取好隊名。','Both teams need a name.'):n[0]===n[1]?TR('兩隊隊名不能相同。','The two teams need different names.'):'';
  if($('#go')){$('#go').disabled=!!why;$('#gowhy').textContent=why}
  if($('#cfgtxt'))$('#cfgtxt').textContent=`${S.league==='CPBL'?TR('中華職棒','CPBL'):TR('美國職棒大聯盟','MLB')} · ${MODEZH[S.mode]} · ${TR(`先發 ${S.slots.SP}・中繼 ${S.slots.RP}・終結者 ${S.slots.CL}`,`SP ${S.slots.SP} · RP ${S.slots.RP} · CL ${S.slots.CL}`)} · ${TR('每隊預算','Budget')} $${cfg.budget} · ${TR('總籤數','Lots')} ${cfg.lotMax}. ${why||TR('等待房主開始選秀。','Waiting for the host to start the draft.')}`;
}
function startOnlineDraft(){
  const su=(NET.doc&&NET.doc.setup)||{},n=roomNames();
  const parks=[0,1].map(i=>Math.min(i===0?+$('#pk').value:((su[i]||{}).park??1),PARKS.length-1));
  const bud=clamp(parseInt($('#bud').value)||200,30,1000);
  S.budget=bud;S.lotMax=Math.max(clamp(parseInt($('#lots').value)||50,34,200),lotsNeeded());
  S.teams=[0,1].map(i=>({name:n[i],park:parks[i],budget:bud,roster:[],done:false}));
  S.deck=POOL.slice();
  for(let i=S.deck.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[S.deck[i],S.deck[j]]=[S.deck[j],S.deck[i]]}
    newDeckOrder();
  S.lotNo=0;S.log=[];S.lot=null;S.trade=null;S.series=null;S.game=null;S.screen='draft';
  // the draw order goes out once; each bid afterwards only says which players are gone
  {const deck0={k:S.deckKey,ids:S.deck0};NET.doc={...(NET.doc||{}),deck0};dbWrite(()=>NET.ref.update({deck0}))}
  nextLot();sync();
}

function render(){
  document.title=TR('大聯盟盲標對決','MLB Blind Auction');
  if($('#followbtn')){$('#follow span').textContent=TR('對手已經前往下一步。','Your opponent has moved on.');$('#followbtn').textContent=TR('跟上','Catch up')}
  updateNetBadge();
  $('#app').className='wrap s-'+S.screen;
  const f={home:renderHome,setup:renderSetup,draft:renderDraft,pregame:renderPregame,trade:renderTrade,pick:renderPick,game:startGame,room:renderRoom}[S.screen];
  if(f) return f();
  if(S.screen==='stuck'){ $('#app').innerHTML=`${header()}<section class="panel"><h2>${TR('球員池用完了','Out of players')}</h2><p class="hint">${TR('剩下的球員沒有人能填補還缺的位置。請重新選秀。','No remaining player can fill the missing spots. Start a new draft.')}</p><button id="restart">${TR('重新選秀','New draft')}</button></section>`; $('#restart').onclick=()=>{S.screen=NET.on?'room':'setup';sync();render()}; }
}
setLeague(S.league);
render();
